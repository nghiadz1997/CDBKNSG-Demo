<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Indoor Nav PRO - Advanced Smart Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes dash { to { stroke-dashoffset: -40; } }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            50% { opacity: 0.5; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .route-line { 
            stroke-dasharray: 12, 6; 
            animation: dash 1.2s linear infinite; 
            filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.8));
        }

        html, body {
            overflow: hidden;
            width: 100%; height: 100%;
            height: 100dvh;
            margin: 0; padding: 0;
            touch-action: none;
            background-color: #f1f5f9;
        }

        #viewport {
            overflow: hidden;
            width: 100%; height: 100%;
            cursor: grab;
            position: relative;
            touch-action: none;
            transition: background-color 0.3s ease;
        }
        #viewport:active { cursor: grabbing; }

        .node-ui { 
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
            cursor: pointer; 
            pointer-events: auto;
        }
        .dragging { opacity: 0.5 !important; z-index: 1000 !important; transition: none !important; }

        .current-loc-pulse {
            position: relative;
        }
        .current-loc-pulse::before {
            content: '';
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; background: inherit;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: -1;
        }

        #map-container {
            width: 1200px; height: 800px;
            position: absolute;
            transform-origin: 0 0;
            left: 0;
            top: 0;
            will-change: transform;
            flex-shrink: 0;
        }

        .map-label {
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 800;
            font-size: 8px;
            color: #1e293b;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .cat-classroom { background-color: #22c55e !important; } /* Xanh lá */
        .cat-office { background-color: #a855f7 !important; }    /* Tím */
        .cat-service { background-color: #eab308 !important; }   /* Vàng */
        .cat-emergency { background-color: #ef4444 !important; } /* Đỏ */

        .sidebar-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>

    function removeVietnameseTones(str) {
        str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
        str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
        str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
        str = str.replace(/ò|ó|ọ|ỏ|ã|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
        str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
        str = str.replace(/ỳ|á|ỵ|ỷ|ỹ/g, "y");
        str = str.replace(/đ/g, "d");
        return str.toLowerCase().trim();
    }

    function normalizeTypo(str) {

        let text = removeVietnameseTones(str).replace(/[\s\.-]/g, '');

        });
        edges.forEach(([id1, id2]) => {

    // TỐI ƯU HÓA: Cho phép tìm đường trực tiếp xuyên biên giới các Khu nếu chúng chung một ảnh sơ đồ (mặt bằng ngang)
    function findShortestPath(startId, targetIdOrPredicate) {
        let q = [[startId]], visited = new Set();
        while(q.length > 0) {
            const path = q.shift();
            const currId = path[path.length - 1];
            const currNode = nodes[currId];
            if (!currNode) continue;

            const isTarget = typeof targetIdOrPredicate === 'function' 
                ? targetIdOrPredicate(currNode) 
                : currId === targetIdOrPredicate;

            if (isTarget) return path;

            if (!visited.has(currId)) {
                visited.add(currId);
                const conns = currNode.connections || [];
                conns.forEach(nId => {
                    if (nodes[nId] && getFloorImage(nodes[nId].floor) === getFloorImage(currNode.floor)) {
                        if (routingPref === 'elevator' && nodes[nId].type === 'stairs') return;
                        q.push([...path, nId]);
                    }
                });
            }
        }
        return null;
    }

    // THUẬT TOÁN TÍNH TOÁN DANH SÁCH CHUỖI CÁC TẦNG ĐI QUA (Hỗ trợ định tuyến tuần tự)
    function getFloorSequence(startFloor, endFloor) {
        if (startFloor === endFloor) return [startFloor];
        
        const startArea = startFloor.split('-')[0];
        const endArea = endFloor.split('-')[0];
        
        const areaOrders = {
            'A': ['A-G', 'A-1', 'A-2'],
            'B': ['B-G', 'B-1', 'B-2', 'B-3', 'B-4'],
            'C': ['C-G'],
            'D': ['D-G']
        };

        if (startArea === endArea) {
            const list = areaOrders[startArea] || [];
            const startIdx = list.indexOf(startFloor);
            const endIdx = list.indexOf(endFloor);
            if (startIdx === -1 || endIdx === -1) return [startFloor, endFloor];
            
            const seq = [];
            if (startIdx <= endIdx) {
                for (let i = startIdx; i <= endIdx; i++) seq.push(list[i]);
            } else {
                for (let i = startIdx; i >= endIdx; i--) seq.push(list[i]);
            }
            return seq;
        } else {
            // Trường hợp liên khu vực (VD: Từ lầu 1 Khu A sang lầu 3 Khu B -> Đi xuống trệt A, sang trệt B, đi lên lầu 3 B)
            const toGround = areaOrders[startArea] ? areaOrders[startArea][0] : startFloor;
            const fromGround = areaOrders[endArea] ? areaOrders[endArea][0] : endFloor;
            
            const leg1 = getFloorSequence(startFloor, toGround);
            const leg2 = getFloorSequence(fromGround, endFloor);
            
            const combined = [...leg1];
            leg2.forEach(f => {
                if (combined[combined.length - 1] !== f) {
                    combined.push(f);
                }
            });
            return combined;
        }
    }

    // TÌM CẦU THANG/THANG MÁY KẾT NỐI TỐI ƯU NHẤT GIỮA HAI TẦNG KỀ NHAU (Dựa trên quãng đường và vị trí XY)
    function findBestTransition(fromFloor, toFloor, fromNodeId, finalDestNodeId) {
        const startNode = nodes[fromNodeId];
        if (!startNode) return null;
        
        const candidates = Object.values(nodes).filter(n => n.floor === fromFloor && (n.type === 'stairs' || n.type === 'elevator'));
        let bestTransitionStart = null;
        let bestTransitionEnd = null;
        let bestScore = Infinity; 
        
        candidates.forEach(tStartNode => {
            const matchingEnds = Object.values(nodes).filter(n => n.floor === toFloor && n.type === tStartNode.type);
            if (matchingEnds.length === 0) return;
            
            // Đối khớp trục kỹ thuật đứng chính xác nhất bằng khoảng cách hình chiếu 2D XY
            let closestEndNode = null;
            let minDistance = Infinity;
            matchingEnds.forEach(tEndNode => {
                const dx = tStartNode.x - tEndNode.x;
                const dy = tStartNode.y - tEndNode.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestEndNode = tEndNode;
                }
            });
            
            if (!closestEndNode) return;
            
            // Tính điểm tối ưu: Tổng số bước đi tới thang hiện tại + Ước lượng khoảng cách từ thang đích đến phòng cuối cùng
            const path1 = findShortestPath(fromNodeId, tStartNode.id);
            if (path1) {
                const destNode = nodes[finalDestNodeId];
                let distToDest = 0;
                if (destNode) {
                    const dx = closestEndNode.x - destNode.x;
                    const dy = closestEndNode.y - destNode.y;
                    distToDest = Math.sqrt(dx * dx + dy * dy);
                }
                const score = path1.length + distToDest / 50; 
                if (score < bestScore) {
                    bestScore = score;
                    bestTransitionStart = tStartNode;
                    bestTransitionEnd = closestEndNode;
                }
            }
        });
        
        if (bestTransitionStart && bestTransitionEnd) {
            return { start: bestTransitionStart, end: bestTransitionEnd };
        }
        return null;
    }

    // ĐỘNG CƠ CẬP NHẬT TUYẾN ĐƯỜNG ĐA TẦNG TUẦN TỰ (Sequential Route State Updater)
    // TỐI ƯU: Nhóm các khu vực nằm cùng một mặt phẳng ngang (Trệt) để hiển thị lộ trình đi bộ ngang trước khi chuyển tầng.
    function updateRouteAndUI() {
        if (!localStartId || !localEndId) {
            route = [];
            crossFloorRouting = null;
            navigationActive = false;
            hideRouteSummaryUI();
            updateUI();
            return;
        }

        const S = nodes[localStartId];
        const E = nodes[localEndId];
        if (!S || !E) return;

        // Khởi tạo tiến trình dẫn đường ảo tuần tự nếu mới bắt đầu hoặc đổi điểm đích
        if (!navigationActive || navigationTargetNodeId !== localEndId) {
            navigationActive = true;
            navigationCurrentNodeId = localStartId;
            navigationTargetNodeId = localEndId;
            floorSequence = getFloorSequence(S.floor, E.floor);
        }

        const currentNavNode = nodes[navigationCurrentNodeId];
        if (!currentNavNode) return;

        const navFloor = currentNavNode.floor;
        const currentFloorIdx = floorSequence.indexOf(navFloor);

        route = [];
        crossFloorRouting = null;

        // Đảm bảo màn hình hiển thị (map viewed floor) nhảy mượt mà về đúng tầng mà người dùng đang đứng ảo trong hành trình
        if (currentFloorId !== navFloor) {
            currentFloorId = navFloor;
            updateUI(); 
            return; // Dừng lại để đợi map load xong ảnh của tầng mới rồi chạy lại
        }

        const currentMapImage = getFloorImage(navFloor);
        const targetMapImage = getFloorImage(E.floor);

        if (currentMapImage === targetMapImage) {
            // Đã cùng mặt phẳng sơ đồ hiển thị (vd: cùng nằm trên sơ đồ trệt chung), vẽ đường đi trực tiếp ngang
            route = findShortestPath(navigationCurrentNodeId, localEndId) || [];
        } else {
            // Khác mặt phẳng sơ đồ, cần tìm điểm thang gần nhất để chuyển tầng tiếp theo trong sequence
            let nextMapFloor = null;
            for (let i = currentFloorIdx + 1; i < floorSequence.length; i++) {
                if (getFloorImage(floorSequence[i]) !== currentMapImage) {
                    nextMapFloor = floorSequence[i];
                    break;
                }
            }

            if (nextMapFloor) {
                // Liệt kê mọi tầng cùng dùng chung sơ đồ hiển thị này (vd: A-G, B-G, C-G, D-G)
                const sameMapFloors = floors.filter(f => f.image === currentMapImage).map(f => f.id);
                
                let bestTransition = null;
                let bestScore = Infinity;

                sameMapFloors.forEach(fId => {
                    const trans = findBestTransition(fId, nextMapFloor, navigationCurrentNodeId, localEndId);
                    if (trans) {
                        const path = findShortestPath(navigationCurrentNodeId, trans.start.id);
                        if (path) {
                            const score = path.length;
                            if (score < bestScore) {
                                bestScore = score;
                                bestTransition = trans;
                            }
                        }
                    }
                });

                if (bestTransition) {
                    route = findShortestPath(navigationCurrentNodeId, bestTransition.start.id) || [];
                    crossFloorRouting = {
                        startFloor: bestTransition.start.floor,
                        endFloor: bestTransition.end.floor,
                        transitionStartId: bestTransition.start.id,
                        transitionEndId: bestTransition.end.id
                    };
                }
            }
        }

        renderEdges();
        renderNodes();
        checkNextFloorPrompt();
        autoFocusRoute();
    }

    function clamp(val, min, max) {
        return Math.min(Math.max(val, min), max);
    }

    // TỐI ƯU CỰC MẠNH MOBILE: Mở rộng biên kéo tối đa, chống bị lock cứng, giúp vuốt kéo xem được toàn phần bản đồ dễ dàng như trên PC
    function limitBounds() {
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const visibleWidth = vW - sidebarWidth;

        // Cho phép thu phóng tự do hơn, không bị khóa cứng tỉ lệ nhỏ
        const minScaleX = (visibleWidth * 0.4) / MAP_WIDTH; 
        const minScaleY = (vH * 0.4) / MAP_HEIGHT;
        const minScale = Math.max(Math.min(minScaleX, minScaleY), 0.12);
        
        if (view.scale < minScale) {
            view.scale = minScale;
        }
        if (view.scale > 5.0) {
            view.scale = 5.0;
        }

        const mapW = MAP_WIDTH * view.scale;
        const mapH = MAP_HEIGHT * view.scale;

        // BIÊN TỰ DO THÔNG THOÁNG: Người dùng thoải mái vuốt ngang dọc để duyệt bản đồ, chỉ cần giữ lại ít nhất 100px của sơ đồ trên màn hình hiển thị
        const minX = sidebarWidth - mapW + 100;
        const maxX = vW - 100;
        const minY = -mapH + 100;
        const maxY = vH - 100;

        view.x = clamp(view.x, minX, maxX);
        view.y = clamp(view.y, minY, maxY);
    }

    // NÂNG CẤP TRANSITION: Chỉ dùng hiệu ứng mượt khi auto-center, tắt khi vuốt tay để phản hồi vuốt mượt lập tức không bị lag giật
    function applyTransform(smooth = false) { 
        limitBounds();
        if (smooth) {
            mapContainer.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
        } else {
            mapContainer.style.transition = 'none';
        }
        mapContainer.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale}) rotate(${view.rotation}deg)`; 
    }

    function setupInitialView() {
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        
        // Tránh lỗi khởi động kích thước 0
        if (vW < 50 || vH < 50) {
            setTimeout(setupInitialView, 50);
            return;
        }

        const visibleWidth = vW - sidebarWidth;
        
        // Mobile cực ít padding để tối ưu không gian màn hình nhỏ
        const pad = window.innerWidth < 768 ? 16 : 40;
        const sX = (visibleWidth - pad) / MAP_WIDTH;
        const sY = (vH - pad) / MAP_HEIGHT;
        
        view.scale = Math.min(sX, sY, 1.5);
        
        // CĂN GIỮA TRUNG TÂM HOÀN HẢO THEO ĐÚNG TỶ LỆ VIEWPORT MÀN HÌNH
        view.x = sidebarWidth + (visibleWidth - MAP_WIDTH * view.scale) / 2;
        view.y = (vH - MAP_HEIGHT * view.scale) / 2;
        
        applyTransform(true); // Animate mượt mà về tâm
        renderNodes();
    }

    function autoFocusRoute() {
        if(route.length === 0) return;
        const currentFloorIdVal = currentFloorId;
        const currentFloorObj = floors.find(x => x.id === currentFloorIdVal);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';

        // Tối ưu auto focus: Lấy tất cả nodes trên tuyến đường có chung hình ảnh sơ đồ đang hiển thị
        const currentFloorNodes = route.map(id => nodes[id]).filter(n => {
            if (!n) return false;
            const fObj = floors.find(x => x.id === n.floor);
            return fObj && fObj.image === currentMapImage;
        });
        
        if(currentFloorNodes.length === 0) return;

        let minX = MAP_WIDTH, maxX = 0, minY = MAP_HEIGHT, maxY = 0;
        currentFloorNodes.forEach(n => {
            if(n.x < minX) minX = n.x; if(n.x > maxX) maxX = n.x;
            if(n.y < minY) minY = n.y; if(n.y > maxY) maxY = n.y;
        });

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;

        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const visibleWidth = vW - sidebarWidth;

        const routeW = Math.max(maxX - minX, 100);
        const routeH = Math.max(maxY - minY, 100);
        const scaleX = (visibleWidth - 60) / routeW;
        const scaleY = (vH - 240) / routeH; 
        
        view.scale = Math.min(scaleX, scaleY, 2.2);
        view.x = sidebarWidth + (visibleWidth / 2) - midX * view.scale;
        view.y = (vH / 2) - midY * view.scale;
        
        applyTransform(true);
        renderNodes();
    }

    function focusSingleNode(node) {
        if (!node) return;
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const visibleWidth = vW - sidebarWidth;

        view.scale = 2.0;
        view.x = sidebarWidth + (visibleWidth / 2) - node.x * view.scale;
        view.y = (vH / 2) - node.y * view.scale;
        applyTransform(true);
        renderNodes();
    }

    function toggleSidebar(show) {
        if (show) {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        } else {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }
        setTimeout(() => setupInitialView(), 310);
    }

    function updateUI() {
        const accordionContainer = document.getElementById('floor-accordion-container');
        accordionContainer.innerHTML = '';
        
        const areas = [...new Set(floors.map(f => f.area))];
        areas.forEach((area, index) => {
            const isCurrentArea = floors.find(f => f.id === currentFloorId)?.area === area;

            const groupDiv = document.createElement('div');
            groupDiv.className = "bg-slate-50 rounded-xl overflow-hidden border border-slate-100";
            
            groupDiv.innerHTML = `
                <button class="w-full flex items-center justify-between p-3 text-left font-black text-[10px] text-slate-700 uppercase tracking-wide bg-slate-100/70">
                    <span>🏢 ${area}</span>
                    <span class="transform transition-transform text-[8px] ${isCurrentArea ? 'rotate-180' : ''}">▼</span>
                </button>
                <div class="accordion-content ${isCurrentArea ? 'block' : 'hidden'} p-1 space-y-1"></div>
            `;

            const btnHeader = groupDiv.querySelector('button');
            const contentDiv = groupDiv.querySelector('.accordion-content');

            btnHeader.onclick = () => {
                const isHidden = contentDiv.classList.contains('hidden');
                document.querySelectorAll('.accordion-content').forEach(c => c.classList.add('hidden'));
                groupDiv.parentNode.querySelectorAll('button span:last-child').forEach(s => s.classList.remove('rotate-180'));
                
                if(isHidden) {
                    contentDiv.classList.remove('hidden');
                    btnHeader.querySelector('span:last-child').classList.add('rotate-180');
                } else {
                    contentDiv.classList.add('hidden');
                }
            };

            floors.filter(f => f.area === area).forEach(f => {
                const fBtn = document.createElement('button');
                fBtn.className = `w-full flex items-center justify-between p-2.5 rounded-lg text-[10px] font-bold uppercase transition-all ${currentFloorId === f.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200/50'}`;
                fBtn.innerHTML = `<span>${f.name}</span>`;
                fBtn.onclick = () => window.changeFloor(f.id);
                contentDiv.appendChild(fBtn);
            });

            accordionContainer.appendChild(groupDiv);
        });
        
        const currentFloor = floors.find(x => x.id === currentFloorId);
        if (mapImage.getAttribute('src') !== currentFloor.image) {
            mapImage.src = currentFloor.image;
        }

        renderNodes(); 
        renderEdges(); 
        checkNextFloorPrompt();
    }

    window.changeFloor = (id) => { 
        currentFloorId = id; 
        updateUI(); 
    };

    function buildQrLocationSelector() {
        if (!localStartId && nodes["n_cong"]) {
            localStartId = "n_cong";
            localStorage.setItem('ind_local_start_id', 'n_cong');
        }
        
        if (localStartId && nodes[localStartId]) {
            const startLabel = nodes[localStartId].label.toUpperCase();
            searchInput.value = startLabel;
            sidebarStartInput.value = startLabel;
            
            document.getElementById('clear-search-btn').classList.remove('hidden');
            clearSidebarStartBtn.classList.remove('hidden');
        } else {
            searchInput.value = "";
            sidebarStartInput.value = "";
            
            document.getElementById('clear-search-btn').classList.add('hidden');
            clearSidebarStartBtn.classList.add('hidden');
        }

        if (localEndId && nodes[localEndId]) {
            sidebarEndInput.value = nodes[localEndId].label.toUpperCase();
            clearSidebarEndBtn.classList.remove('hidden');
        } else {
            sidebarEndInput.value = "";
            clearSidebarEndBtn.classList.add('hidden');
        }
    }

    // TỐI ƯU HÓA: Cố định vị trí hiển thị ở tầng xuất phát khi gán điểm đến bằng ô nhập sidebar gợi ý (Không tự động nhảy tầng đích đột ngột)
    function showLocationSuggestions(filterText, suggestionsContainer, inputRole) {
        const value = normalizeTypo(filterText);
        
        const validNodes = Object.values(nodes || {}).filter(n => {
            if (!n || !n.label || n.type === 'waypoint') return false;
            return floors.some(f => f.id === n.floor); 
        });
        
        const matches = validNodes.filter(n => {
            const labelNorm = normalizeTypo(n.label);
            const deptNorm = normalizeTypo(n.dept || '');
            return labelNorm.includes(value) || deptNorm.includes(value);
        });

        const uniqueMatches = [];
        const seenKeys = new Set();
        matches.forEach(n => {
            const key = `${n.label.toUpperCase()}_${n.floor}`;
            if (!seenKeys.has(key)) {
                seenKeys.add(key);
                uniqueMatches.push(n);
            }
        });

        if (uniqueMatches.length > 0) {
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.classList.remove('hidden');
            uniqueMatches.forEach(n => {
                const floorObj = floors.find(f => f.id === n.floor); 
                if (!floorObj) return; // An toàn lọc bỏ Khu - Tầng rác
                const item = document.createElement('div');
                item.className = "p-3 border-b border-slate-100 last:border-none cursor-pointer hover:bg-slate-50 flex justify-between items-center text-xs text-slate-800 font-bold transition-colors";
                item.innerHTML = `
                    <div class="pointer-events-none">
                        <span class="uppercase text-indigo-600">${n.customIcon || '📍'} ${n.label}</span>
                        ${n.dept ? `<span class="text-[9px] text-slate-400 block font-medium">${n.dept}</span>` : ''}
                    </div>
                    <span class="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-black pointer-events-none">${floorObj.area} - ${floorObj.name}</span>
                `;
                item.onclick = (e) => {
                    e.stopPropagation();
                    
                    if (inputRole === 'start') {
                        localStartId = n.id;
                        localStorage.setItem('ind_local_start_id', n.id);
                        navigationActive = false; // Reset lại định tuyến mới
                        
                        showMsg("Đã đặt vị trí hiện tại: " + n.label.toUpperCase());
                        
                        // Chuyển tầng sơ đồ hiển thị khớp với điểm xuất phát
                        currentFloorId = n.floor;
                        
                        if (localEndId && localEndId !== n.id) {
                            updateRouteAndUI();
                        } else {
                            updateUI();
                            focusSingleNode(n);
                            setTimeout(() => {
                                sidebarEndInput.focus();
                                showLocationSuggestions("", sidebarEndSuggestions, 'end');
                            }, 400);
                        }
                    } else if (inputRole === 'end') {
                        localEndId = n.id;
                        navigationActive = false; // Reset định tuyến mới
                        
                        if (!localStartId) {
                            localStartId = "n_cong";
                            localStorage.setItem('ind_local_start_id', 'n_cong');
                        }

                        showMsg("Đang vẽ tuyến đường đến: " + n.label.toUpperCase());
                        
                        // Gọi updateRouteAndUI() để định tuyến từ điểm đầu tiên
                        updateRouteAndUI();
                        showRouteSummaryUI(localEndId);
                    }

                    buildQrLocationSelector();
                    suggestionsContainer.classList.add('hidden');
                };
                suggestionsContainer.appendChild(item);
            });
        } else {
            suggestionsContainer.classList.add('hidden');
        }
    }

    // 1. Ô tìm kiếm chính bên ngoài
    searchInput.oninput = (e) => {
        const rawValue = e.target.value;
        const value = normalizeTypo(rawValue);
        const clearBtn = document.getElementById('clear-search-btn');

        if(value.length > 0) clearBtn.classList.remove('hidden');
        else { 
            clearBtn.classList.add('hidden'); 
            suggestionsBox.classList.add('hidden'); 
            return; 
        }

        showLocationSuggestions(rawValue, suggestionsBox, 'start');
    };

    searchInput.onfocus = () => {
        showLocationSuggestions(searchInput.value, suggestionsBox, 'start');
    };

    document.getElementById('clear-search-btn').onclick = () => {
        searchInput.value = '';
        localStartId = '';
        localStorage.removeItem('ind_local_start_id');
        buildQrLocationSelector();
        document.getElementById('clear-search-btn').classList.add('hidden');
        suggestionsBox.classList.add('hidden');
        if (route.length > 0 || navigationActive) {
            document.getElementById('btn-cancel-route-fast').click();
        }
    };

    // 2. Ô nhập Xuất Phát trong Sidebar
    sidebarStartInput.oninput = (e) => {

            sidebarStartSuggestions.classList.add('hidden');

        }
        showLocationSuggestions(rawValue, sidebarStartSuggestions, 'start');
    };

    sidebarStartInput.onfocus = () => {
        showLocationSuggestions(sidebarStartInput.value, sidebarStartSuggestions, 'start');
    };

    clearSidebarStartBtn.onclick = () => {
        sidebarStartInput.value = '';
        localStartId = '';
        localStorage.removeItem('ind_local_start_id');
        buildQrLocationSelector();
        clearSidebarStartBtn.classList.add('hidden');
        sidebarStartSuggestions.classList.add('hidden');

    // 3. Ô nhập Đích Đến trong Sidebar
    sidebarEndInput.oninput = (e) => {
        const rawValue = e.target.value;
        const value = normalizeTypo(rawValue);
        if(value.length > 0) clearSidebarEndBtn.classList.remove('hidden');
        else {
            clearSidebarEndBtn.classList.add('hidden');
            sidebarEndSuggestions.classList.add('hidden');

        }
        showLocationSuggestions(rawValue, sidebarEndSuggestions, 'end');

        showLocationSuggestions(sidebarEndInput.value, sidebarEndSuggestions, 'end');

    clearSidebarEndBtn.onclick = () => {
        sidebarEndInput.value = '';
        localEndId = null;
        buildQrLocationSelector();
        clearSidebarEndBtn.classList.add('hidden');
        sidebarEndSuggestions.classList.add('hidden');
        if (route.length > 0 || navigationActive) {
            document.getElementById('btn-cancel-route-fast').click();
        }
    };

    // Đóng danh sách gợi ý khi click ra ngoài
    document.addEventListener('click', (e) => {
        if (e.target !== searchInput && !e.target.closest('#search-suggestions')) {
            suggestionsBox.classList.add('hidden');
        }
        if (e.target !== sidebarStartInput && !e.target.closest('#sidebar-start-suggestions')) {
            sidebarStartSuggestions.classList.add('hidden');
        }
        if (e.target !== sidebarEndInput && !e.target.closest('#sidebar-end-suggestions')) {
            sidebarEndSuggestions.classList.add('hidden');
        }
    });

    // TỐI ƯU HÓA: Hiển thị đồng thời các điểm thuộc các khu vực khác nhau nhưng có chung một tệp ảnh sơ đồ nền
    function renderNodes() {
        nodesLayer.innerHTML = '';
        const isRouteActive = route.length > 0;
        const scale = view.scale;

        mapImage.classList.remove('dimmed-map');

        const currentFloorObj = floors.find(x => x.id === currentFloorId);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';

        Object.values(nodes).filter(n => {
            const fObj = floors.find(x => x.id === n.floor);
            return fObj && fObj.image === currentMapImage;
        }).forEach(node => {
            const isSelected = selectedId === node.id;
            const isNavStart = localStartId === node.id;
            const isNavEnd = localEndId === node.id;
            const isPartOfRoute = route.includes(node.id);

            // Xác định xem node hiện tại có phải là vị trí ảo của người dùng hay không
            const isUserCurrentVirtualLoc = navigationActive && navigationCurrentNodeId === node.id;

            // Xác định xem đây có phải là điểm cầu thang chuyển tiếp hiện tại của hành trình
            const isTransitionStart = crossFloorRouting && node.id === crossFloorRouting.transitionStartId;

            if (!isAdmin && node.type === 'waypoint') return;

            let showThisNode = false;
            let showLabel = false;

            if (isAdmin) {
                showThisNode = true;
                showLabel = true;
            } else if (isRouteActive) {
                if (isNavStart || isNavEnd || isUserCurrentVirtualLoc || isTransitionStart) {
                    showThisNode = true;
                    showLabel = true;
                } else if (isPartOfRoute && (node.type === 'stairs' || node.type === 'elevator' || node.customIcon)) {
                    showThisNode = true;
                    showLabel = true;
                }
            } else {
                if (node.type === 'classroom' || node.type === 'office') {
                    if (scale >= 1.4) {
                        showThisNode = true;
                        showLabel = true;
                    }
                } else if (node.type === 'service' || node.type === 'emergency' || node.customIcon) {
                    showThisNode = true;
                    showLabel = scale >= 1.1;
                } else {
                    if (node.label && (node.label.includes("KHU") || node.label.includes("CỔNG") || node.label.includes("SÂN") || node.label.includes("CANTIN"))) {
                        showThisNode = true;
                        showLabel = true;
                    }
                }
            }

            if (!showThisNode) return;

            const div = document.createElement('div');
            let stateClass = isSelected ? 'ring-4 ring-indigo-500' : '';
            if (isUserCurrentVirtualLoc || isNavStart || isTransitionStart) stateClass += ' current-loc-pulse';

            div.className = `node-ui absolute flex flex-col items-center z-20 ${stateClass}`;
            div.style.left = `${node.x}px`; div.style.top = `${node.y}px`;
            div.style.transform = `translate(-50%, -50%) rotate(${-view.rotation}deg)`; 

            let color = 'bg-slate-400';
            if (node.type === 'classroom') color = 'cat-classroom';
            else if (node.type === 'office') color = 'cat-office';
            else if (node.type === 'service') color = 'cat-service';
            else if (node.type === 'emergency') color = 'cat-emergency';

            if (isUserCurrentVirtualLoc || isNavStart) color = 'bg-emerald-500 ring-4 ring-emerald-100';
            if (isNavEnd) color = 'bg-orange-500 ring-4 ring-orange-100 animate-bounce';
            if (isTransitionStart) color = 'bg-indigo-600 ring-4 ring-indigo-200 animate-pulse'; // Phát sáng sóng chuyển tiếp

            // Tăng nhẹ kích thước các mút bấm tương tác trên Mobile cho dễ chạm ngón tay (tối đa size 28px)
            let size = (isUserCurrentVirtualLoc || isNavStart) || isNavEnd || isTransitionStart ? 28 : (isPartOfRoute && (node.type === 'stairs' || node.type === 'elevator') ? 24 : (scale >= 1.6 ? 16 : 12));
            
            let displayIcon = node.customIcon || "📍";
            if (isUserCurrentVirtualLoc || isNavStart) displayIcon = "🚶";
            if (isNavEnd) displayIcon = "🎯";
            if (isTransitionStart) displayIcon = "🪜"; // Cầu thang nhấp nháy chuyển tiếp

            const useMiniDot = !(isUserCurrentVirtualLoc || isNavStart) && !isNavEnd && !isPartOfRoute && scale < 1.3;

            div.innerHTML = useMiniDot ? `
                <div class="rounded-full border border-white ${color} shadow-md hover:scale-125 transition-transform" style="width: 10px; height: 10px;"></div>
                ${showLabel && node.label ? `<div class="map-label mt-1">${node.label.toUpperCase()}</div>` : ''}
            ` : `
                <div class="rounded-full border-2 border-white ${color} flex items-center justify-center shadow-lg text-white font-bold hover:scale-110 transition-transform" style="width: ${size}px; height: ${size}px; font-size: ${size * 0.55}px;">
                    ${displayIcon}
                </div>
                ${showLabel && node.label ? `
                    <div class="map-label mt-1 text-center">
                        ${isUserCurrentVirtualLoc || isNavStart ? '<span class="text-[7px] text-emerald-500 block uppercase tracking-tighter font-extrabold">BẠN Ở ĐÂY</span>' : ''}
                        ${isTransitionStart ? '<span class="text-[7px] text-indigo-600 block uppercase tracking-tighter font-extrabold animate-bounce">BẤM LÊN TẦNG</span>' : ''}
                        ${node.label.toUpperCase()}
                    </div>
                ` : ''}
            `;

            let sX, sY, hM = false, startNodeX, startNodeY;
            const onS = (cX, cY) => {
                if (!isAdmin) return;
                sX = cX; sY = cY; hM = false;
                startNodeX = nodes[node.id].x; startNodeY = nodes[node.id].y;

                const onM = (me) => {
                    const curX = me.touches ? me.touches[0].clientX : me.clientX;
                    const curY = me.touches ? me.touches[0].clientY : me.clientY;
                    if (Math.abs(curX - sX) > 2 || Math.abs(curY - sY) > 2) {
                        if (mode === 'select') {
                            hM = true; div.classList.add('dragging');
                            let dx = (curX - sX) / view.scale, dy = (curY - sY) / view.scale;
                            const rad = -view.rotation * (Math.PI / 180);
                            nodes[node.id].x = startNodeX + (dx * Math.cos(rad) - dy * Math.sin(rad));
                            nodes[node.id].y = startNodeY + (dx * Math.sin(rad) + dy * Math.cos(rad));
                            div.style.left = `${nodes[node.id].x}px`; div.style.top = `${nodes[node.id].y}px`;
                            renderEdges();
                        }
                    }
                };
                const onE = () => {
                    window.removeEventListener('mousemove', onM); window.removeEventListener('mouseup', onE);
                    window.removeEventListener('touchmove', onM); window.removeEventListener('touchend', onE);
                    if (hM) { div.classList.remove('dragging'); saveData(true); } else handleNodeClick(node.id);
                };
                window.addEventListener('mousemove', onM); window.addEventListener('mouseup', onE);
                window.addEventListener('touchmove', onM, {passive:false}); window.addEventListener('touchend', onE);
            };

            div.onmousedown = (e) => { e.stopPropagation(); onS(e.clientX, e.clientY); };
            div.ontouchstart = (e) => { e.stopPropagation(); onS(e.touches[0].clientX, e.touches[0].clientY); };
            div.onclick = (e) => { e.stopPropagation(); handleNodeClick(node.id); };
            nodesLayer.appendChild(div);
        });
    }

    // TỐI ƯU HÓA: Vẽ đường nét đứt dẫn hướng đi bộ liên tục trên cùng mặt bằng ngang
    function renderEdges() {
        svgLayer.innerHTML = '';
        const currentFloorObj = floors.find(x => x.id === currentFloorId);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';
        
        if (isAdmin) {
            edges.forEach(edge => {
                const n1 = nodes[edge[0]], n2 = nodes[edge[1]];
                if (n1 && n2 && getFloorImage(n1.floor) === currentMapImage && getFloorImage(n2.floor) === currentMapImage) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", n1.x); line.setAttribute("y1", n1.y);
                    line.setAttribute("x2", n2.x); line.setAttribute("y2", n2.y);
                    line.setAttribute("stroke", "#cbd5e1"); 
                    line.setAttribute("stroke-width", "1.5");
                    line.setAttribute("stroke-dasharray", "3");
                    svgLayer.appendChild(line);
                }
            });
        }
        
        for (let i = 0; i < route.length - 1; i++) {
            const n1 = nodes[route[i]], n2 = nodes[route[i+1]];
            if (n1 && n2 && getFloorImage(n1.floor) === currentMapImage && getFloorImage(n2.floor) === currentMapImage) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", n1.x); line.setAttribute("y1", n1.y);
                line.setAttribute("x2", n2.x); line.setAttribute("y2", n2.y);
                line.setAttribute("stroke", "#f97316"); line.setAttribute("stroke-width", "4");
                line.setAttribute("stroke-linecap", "round"); line.setAttribute("class", "route-line");
                svgLayer.appendChild(line);
            }
        }
    }

    function handleNodeClick(id) {
        const node = nodes[id]; if(!node) return;
        if (isAdmin) {
            if (mode === 'select') { selectedId = id; propsPanel.classList.remove('hidden'); updatePropsUI(); } 
            else if (mode === 'connect') {
                if (selectedId && selectedId !== id) { toggleEdge(selectedId, id); selectedId = id; } else selectedId = id;
            }
            renderNodes();
        } else {
            // Chuyển tầng mượt mà khi nhấp trực tiếp vào cầu thang dẫn đường trên bản đồ
            if (crossFloorRouting && (id === crossFloorRouting.transitionStartId || id === crossFloorRouting.transitionEndId)) {
                const targetFloorId = crossFloorRouting.endFloor;
                window.changeFloor(targetFloorId);
                
                // Cập nhật vị trí ảo lên tầng tiếp theo
                navigationCurrentNodeId = crossFloorRouting.transitionEndId;
                showMsg(`Đã lên ${floors.find(f => f.id === targetFloorId).name.toUpperCase()} - Tiếp tục di chuyển!`);
                updateRouteAndUI();
                return;
            }

            if (node.type !== 'waypoint') {
                if (!localStartId) {
                    localStartId = id;
                    localStorage.setItem('ind_local_start_id', id);
                    navigationActive = false;
                    buildQrLocationSelector();
                    showMsg("Đã đặt điểm xuất phát: " + node.label);
                    focusSingleNode(node);
                    
                    setTimeout(() => {
                        sidebarEndInput.placeholder = `📍 Điểm đến tiếp theo từ [${node.label}]?`;
                        sidebarEndInput.focus();
                        showLocationSuggestions("", sidebarEndSuggestions, 'end');
                    }, 450);
                } else if (localStartId === id) {
                    showMsg("Bạn đang ở vị trí này rồi!", false);
                } else {
                    localEndId = id;
                    navigationActive = false;
                    showMsg("Đang vẽ tuyến đường đến: " + node.label);
                    buildQrLocationSelector();
                    updateRouteAndUI();
                }
                renderNodes();
            }
        }
    }

    function toggleEdge(id1, id2) {
        const idx = edges.findIndex(e => (e[0]===id1 && e[1]===id2) || (e[0]===id2 && e[1]===id1));
        if(idx !== -1) edges.splice(idx, 1); else edges.push([id1, id2]);
        renderEdges();
    }

    function showRouteSummaryUI(destId) {
        const destNode = nodes[destId];
        if(!destNode) return;

        routeSummaryCard.classList.remove('hidden');
        quickActionsBar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        document.getElementById('route-summary-dest').innerText = destNode.label.toUpperCase();
        
        // Tính tổng số bước ước tính toàn bộ chặng di chuyển đa tầng
        let totalNodesCount = route.length;
        if (navigationActive && floorSequence.length > 1) {
            // Đếm sơ bộ số lượng nút của toàn lộ trình liên tầng tuần tự
            totalNodesCount = floorSequence.length * 8; 
        }
        const steps = Math.round(totalNodesCount * 12);
        
        // Hiển thị thông tin chặng di chuyển hiện tại cho sinh động
        let stepProgressText = "";
        if (navigationActive && floorSequence.length > 1) {
            const currentNavNode = nodes[navigationCurrentNodeId];
            const currentFloorIdx = floorSequence.indexOf(currentNavNode?.floor);
            if (currentFloorIdx !== -1) {
                stepProgressText = `Chặng ${currentFloorIdx + 1}/${floorSequence.length}: `;
            }
        }
        document.getElementById('route-summary-steps').innerText = `${stepProgressText}~${steps} bước`;

        const fastSwitchBtn = document.getElementById('btn-route-switch-floor-fast');
        if (crossFloorRouting) {
            fastSwitchBtn.classList.remove('hidden');
            const targetFloor = floors.find(f => f.id === crossFloorRouting.endFloor);
            fastSwitchBtn.innerText = `BẤM LÊN ${targetFloor.name.toUpperCase()} (${targetFloor.area.toUpperCase()})`;
            fastSwitchBtn.onclick = () => {
                window.changeFloor(crossFloorRouting.endFloor);
                
                // Cập nhật vị trí ảo lên tầng tiếp theo
                navigationCurrentNodeId = crossFloorRouting.transitionEndId;
                showMsg(`Đã di chuyển lên ${targetFloor.name.toUpperCase()}`);
                updateRouteAndUI();
            };
        } else {
            fastSwitchBtn.classList.add('hidden');
        }
    }

    function hideRouteSummaryUI() {
        routeSummaryCard.classList.add('hidden');
        quickActionsBar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
    }

    function checkNextFloorPrompt() {
        const p = document.getElementById('next-floor-prompt');
        if (crossFloorRouting) {
            p.classList.remove('hidden');
            const targetFloor = floors.find(f => f.id === crossFloorRouting.endFloor);
            const stairsName = nodes[crossFloorRouting.transitionStartId]?.label || "CẦU THANG";
            document.getElementById('prompt-text').innerText = `TIẾP THEO: LÊN ${targetFloor.name.toUpperCase()} QUA [${stairsName}]`;
            document.getElementById('btn-switch-floor').onclick = () => {
                window.changeFloor(crossFloorRouting.endFloor);
                
                // Cập nhật vị trí ảo lên tầng tiếp theo
                navigationCurrentNodeId = crossFloorRouting.transitionEndId;
                showMsg(`Đã di chuyển lên ${targetFloor.name.toUpperCase()}`);
                updateRouteAndUI();
            };
        } else {
            p.classList.add('hidden');
        }
    }

    const handleStart = (cX, cY) => { isPanning = true; lastMousePos = { x: cX, y: cY }; };
    const handleMove = (cX, cY) => {
        if (!isPanning) return;
        view.x += (cX - lastMousePos.x); view.y += (cY - lastMousePos.y);
        lastMousePos = { x: cX, y: cY }; applyTransform();
    };
    const handleEnd = () => { isPanning = false; lastTouchDist = 0; };

    viewport.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const nS = Math.min(Math.max(view.scale * delta, 0.1), 5);
        const mX = (e.clientX - view.x) / view.scale, mY = (e.clientY - view.y) / view.scale;
        view.x = e.clientX - mX * nS; view.y = e.clientY - mY * nS; view.scale = nS;
        applyTransform();
        renderNodes();
    };

    viewport.onmousedown = (e) => { 
        if(e.target.closest('.node-ui') || e.target.closest('aside') || e.target.closest('div.absolute') || e.target.closest('div.fixed')) return; 
        handleStart(e.clientX, e.clientY); 
    };
    window.onmousemove = (e) => { handleMove(e.clientX, e.clientY); };
    window.onmouseup = handleEnd;

    // TỐI ƯU CỦ THỂ MOBILE: Chạm đúp (double-tap) để thu phóng thông minh ngay tại tâm chạm cực mượt
    let lastTap = 0;
    viewport.addEventListener('touchend', (e) => {
        let currentTime = new Date().getTime();
        let tapLength = currentTime - lastTap;
        if (tapLength < 250 && tapLength > 0) {
            e.preventDefault();
            if (view.scale > 1.3) {
                // Đang zoom to -> Reset về toàn cảnh
                setupInitialView();
            } else {
                const rect = viewport.getBoundingClientRect();
                const touch = e.changedTouches[0];
                const tX = touch.clientX - rect.left;
                const tY = touch.clientY - rect.top;
                
                // Phóng to tại đúng tâm điểm ngón tay vừa chạm đúp
                const nS = 2.0;
                const mX = (tX - view.x) / view.scale;
                const mY = (tY - view.y) / view.scale;
                
                view.scale = nS;
                view.x = tX - mX * nS;
                view.y = tY - mY * nS;
                applyTransform(true); // Animation zoom mượt
                renderNodes();
            }
        }
        lastTap = currentTime;
    });

    viewport.addEventListener('touchstart', (e) => {
        if(e.target.closest('.node-ui') || e.target.closest('aside') || e.target.closest('div.absolute') || e.target.closest('div.fixed')) return;
        if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
        else if (e.touches.length === 2) lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
        else if (e.touches.length === 2 && lastTouchDist > 0) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const delta = dist / lastTouchDist;
            const nS = Math.min(Math.max(view.scale * delta, 0.1), 5);
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            
            const mX = (midX - view.x) / view.scale;
            const mY = (midY - view.y) / view.scale;
            
            view.scale = nS; 
            view.x = midX - mX * nS;
            view.y = midY - mY * nS;
            lastTouchDist = dist; 
            applyTransform(); // Vuốt zoom tức thời ko bị trễ phản hồi
            renderNodes();
        }
    }, { passive: false });
    viewport.addEventListener('touchend', handleEnd);

    document.querySelectorAll('.quick-action-btn').forEach(btn => {
        btn.onclick = () => {
            const type = btn.dataset.type;
            const availableNodes = Object.values(nodes).filter(n => n.customIcon === '🚻' && type === 'wc' || n.customIcon === '☕' && type === 'canteen' || n.customIcon === '📚' && type === 'library' || n.type === 'elevator' && type === 'elevator');
            
            if(availableNodes.length > 0) {
                let target = availableNodes.find(n => n.floor === currentFloorId) || availableNodes[0];
                currentFloorId = target.floor;
                localEndId = target.id;
                navigationActive = false;
                
                if (!localStartId) {
                    localStartId = "n_cong";
                    localStorage.setItem('ind_local_start_id', 'n_cong');
                }
                
                updateUI();
                updateRouteAndUI();
                buildQrLocationSelector();
                showRouteSummaryUI(localEndId);
                showMsg(`Đang dẫn đường tới [${target.label}] gần nhất`);
            } else {
                showMsg("Chưa tìm thấy thiết bị dịch vụ tương ứng trên sơ đồ!", false);
            }
        };
    });

    document.getElementById('menu-trigger-btn').onclick = () => toggleSidebar(true);
    document.getElementById('close-sidebar-btn').onclick = () => toggleSidebar(false);
    sidebarOverlay.onclick = () => toggleSidebar(false);

    document.getElementById('quick-recenter-btn').onclick = () => setupInitialView();
    document.getElementById('btn-recenter').onclick = () => setupInitialView();
    
    document.getElementById('btn-rotate').onclick = () => {
        view.rotation = (view.rotation + 90) % 360; applyTransform(true); renderNodes();
    };

    document.getElementById('qr-mock-btn').onclick = () => {
        const locationNodes = Object.values(nodes).filter(n => {
            if (!n || !n.label || n.type === 'waypoint') return false;
            return floors.some(f => f.id === n.floor); 
        });
        if (locationNodes.length > 0) {
            const randomNode = locationNodes[Math.floor(Math.random() * locationNodes.length)];
            
            localStartId = randomNode.id;
            localStorage.setItem('ind_local_start_id', randomNode.id);
            navigationActive = false;
            buildQrLocationSelector();
            
            currentFloorId = randomNode.floor;
            updateUI();
            focusSingleNode(randomNode);
            showMsg(`📲 Đã check-in thành công vị trí tại: [${randomNode.label.toUpperCase()}]`);
            
            if (localEndId && localEndId !== randomNode.id) {
                updateRouteAndUI();
                showRouteSummaryUI(localEndId);
            } else {
                setTimeout(() => {
                    toggleSidebar(true);
                    sidebarEndInput.placeholder = `📍 Điểm muốn đến từ [${randomNode.label}]?`;
                    sidebarEndInput.focus();
                    showLocationSuggestions("", sidebarEndSuggestions, 'end');
                }, 500);
            }
        }
    };

    document.querySelectorAll('.pref-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.pref-btn').forEach(b => b.className = "pref-btn py-1.5 text-[9px] font-black uppercase rounded-lg transition-all text-slate-500");
            btn.className = "pref-btn py-1.5 text-[9px] font-black uppercase rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
            routingPref = btn.dataset.pref;
            if(localStartId && localEndId) {
                updateRouteAndUI();
                showRouteSummaryUI(localEndId);
            }
        };
    });

    document.getElementById('secret-login-trigger').onclick = () => {
        loginClickCount++; if (loginClickCount >= 5) { loginModal.classList.remove('hidden'); loginClickCount = 0; }
    };
    document.getElementById('btn-login-confirm').onclick = () => {
        if(document.getElementById('admin-password').value === 'Nsg@2026') {
            isAdmin = true; loginModal.classList.add('hidden');
            document.getElementById('admin-tools').classList.remove('hidden'); updateUI();
            showMsg("Đã kích hoạt chế độ nhà phát triển!");
        } else alert("Mật khẩu truy cập không chính xác!");
    };
    document.getElementById('btn-login-cancel').onclick = () => loginModal.classList.add('hidden');
    document.getElementById('btn-logout').onclick = () => { isAdmin = false; location.reload(); };

    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tool-btn').forEach(b => b.className = "tool-btn p-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-[9px] font-black uppercase");
            btn.className = "tool-btn p-2 rounded-xl border border-transparent bg-indigo-600 text-white text-[9px] font-black uppercase";
            mode = btn.dataset.mode; selectedId = null; propsPanel.classList.add('hidden'); renderNodes();
        };
    });

    document.getElementById('btn-save-all').onclick = () => { sanitizeConnections(); saveData(); };

    // HỦY TUYẾN ĐƯỜNG DẪN ĐƯỜNG CỤC BỘ
    document.getElementById('btn-cancel-route-fast').onclick = () => {
        route = []; 
        localEndId = null;
        crossFloorRouting = null;
        navigationActive = false;
        navigationCurrentNodeId = null;
        navigationTargetNodeId = null;
        floorSequence = [];
        
        buildQrLocationSelector();
        hideRouteSummaryUI();
        updateUI();
        setupInitialView();
    };

    function updatePropsUI() {
        const node = nodes[selectedId]; if(!node) return;
        document.getElementById('node-label-input').value = node.label || "";
        document.getElementById('node-dept-input').value = node.dept || "";
        
        document.querySelectorAll('.type-opt').forEach(btn => {
            const t = btn.id.replace('btn-type-', '');
            btn.className = `type-opt p-2 border rounded-lg text-[9px] font-black text-left transition-all ${node.type === t ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-400 border-slate-200'}`;
        });

        document.querySelectorAll('.icon-opt').forEach(btn => {
            const icon = btn.dataset.icon;
            btn.className = `icon-opt border p-1 rounded text-center text-xs transition-all ${node.customIcon === icon ? 'bg-orange-500 text-white' : 'bg-white text-slate-700'}`;
        });
    }

    document.getElementById('btn-close-props').onclick = () => { selectedId = null; propsPanel.classList.add('hidden'); renderNodes(); };
    
    // TỐI ƯU SỰ KIỆN: Chỉ kích hoạt lưu (saveData) khi thay đổi hoàn tất để tránh nghẽn luồng tiêu điểm
    document.getElementById('node-label-input').oninput = (e) => {
        if(selectedId) { 
            nodes[selectedId].label = e.target.value.toUpperCase(); 
            renderNodes(); 
        }
    };
    document.getElementById('node-label-input').onchange = (e) => {
        if(selectedId) {
            saveData(true);
        }
    };

    document.getElementById('node-dept-input').oninput = (e) => {
        if(selectedId) { 
            nodes[selectedId].dept = e.target.value; 
        }
    };
    document.getElementById('node-dept-input').onchange = (e) => {
        if(selectedId) {
            saveData(true);
        }
    };

    document.querySelectorAll('.type-opt').forEach(btn => {
        btn.onclick = () => {
            if(selectedId) {
                nodes[selectedId].type = btn.id.replace('btn-type-', '');
                updatePropsUI(); 
                renderNodes(); 
                saveData(true);
            }
        };
    });

    document.querySelectorAll('.icon-opt').forEach(btn => {
        btn.onclick = () => {
            if(selectedId) {
                nodes[selectedId].customIcon = btn.dataset.icon;
                updatePropsUI(); 
                renderNodes(); 
                buildQrLocationSelector(); 
                saveData(true);
            }
        };
    });

    document.getElementById('btn-delete-node').onclick = () => {
        if(selectedId) {
            edges = edges.filter(e => e[0] !== selectedId && e[1] !== selectedId);
            delete nodes[selectedId]; selectedId = null; propsPanel.classList.add('hidden'); updateUI(); saveData(true);
        }
    };

    mapContainer.onclick = (e) => {
        if(isAdmin && mode === 'add' && !e.target.closest('.node-ui')) {
            const rect = mapContainer.getBoundingClientRect();
            const id = `n${Date.now()}_${Math.floor(Math.random()*1000)}`;
            nodes[id] = { id, x: (e.clientX - rect.left) / view.scale, y: (e.clientY - rect.top) / view.scale, label: "PHÒNG MỚI", dept: "", type: "waypoint", customIcon: "", floor: currentFloorId, connections: [] };
            saveData(true); updateUI();
        }
    };

    // TỐI ƯU HOÀN HẢO CHO MOBILE: 
    // Chặn hoàn toàn sự kiện co giãn chiều cao (URL Bar dâng lên hạ xuống) gây giật lag hoặc reset zoom.
    // Chỉ kích hoạt render lại khi người dùng thực sự thay đổi chiều ngang (như xoay màn hình).
    window.onload = () => {
        initCloudSync(); 
        setupInitialView();
        mapImage.onload = () => setupInitialView();
        window.onresize = () => {
            if (window.innerWidth !== lastWidth) {
                lastWidth = window.innerWidth;
                setupInitialView();
            }
        };
    };
</script>
</body>
</html>
