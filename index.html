<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Indoor Nav PRO - Advanced Smart Navigation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes dash { to { stroke-dashoffset: -40; } }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            50% { opacity: 0.5; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .route-line { 
            stroke-dasharray: 12, 6; 
            animation: dash 1.2s linear infinite; 
            filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.8));
        }

        html, body {
            overflow: hidden;
            width: 100%; height: 100%;
            height: 100dvh;
            margin: 0; padding: 0;
            touch-action: none;
            background-color: #f1f5f9;
        }

        #viewport {
            overflow: hidden;
            width: 100%; height: 100%;
            cursor: grab;
            position: relative;
            touch-action: none;
            transition: background-color 0.3s ease;
        }
        #viewport:active { cursor: grabbing; }

        .node-ui { 
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
            cursor: pointer; 
            pointer-events: auto;
        }
        .dragging { opacity: 0.5 !important; z-index: 1000 !important; transition: none !important; }

        .current-loc-pulse {
            position: relative;
        }
        .current-loc-pulse::before {
            content: '';
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; background: inherit;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: -1;
        }

        #map-container {
            width: 1200px; height: 800px;
            position: absolute;
            transform-origin: 0 0;
            left: 0;
            top: 0;
            will-change: transform;
            flex-shrink: 0;
        }

        .map-label {
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 800;
            font-size: 8px;
            color: #1e293b;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .cat-classroom { background-color: #22c55e !important; } /* Xanh lá */
        .cat-office { background-color: #a855f7 !important; }    /* Tím */
        .cat-service { background-color: #eab308 !important; }   /* Vàng */
        .cat-emergency { background-color: #ef4444 !important; } /* Đỏ */

        .sidebar-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-indigo-500 selection:text-white">

<div id="msg-box" class="hidden px-6 py-3 rounded-full text-xs font-bold shadow-2xl fixed top-6 left-1/2 -translate-x-1/2 z-[1000] text-white transition-all"></div>

<div class="flex h-full h-[100dvh] w-screen relative overflow-hidden bg-slate-200" id="app-root">
    
    <!-- Lớp phủ mờ nền khi mở sidebar trên các thiết bị màn hình nhỏ -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[190] transition-opacity duration-300"></div>

    <!-- Hộp tìm kiếm chính gán vị trí hiện tại nổi trên bản đồ (Tối ưu dịch chuyển lg:left-[340px] trên PC để tránh đè Sidebar) -->
    <div class="absolute top-4 left-4 right-4 lg:left-[340px] md:right-auto md:w-96 z-[140] flex flex-col gap-2 pointer-events-none">
        <div class="w-full bg-white/95 backdrop-blur-md shadow-xl rounded-2xl p-3 flex items-center gap-2.5 border border-slate-100 pointer-events-auto transition-all">
            <button id="menu-trigger-btn" class="p-2.5 hover:bg-slate-100 rounded-xl text-slate-600 transition-colors" title="Mở danh mục sơ đồ">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <div class="flex-1 relative">
                <input id="smart-search-input" type="text" placeholder="Nhập vị trí hiện tại của bạn..." class="w-full pl-1 pr-6 py-1.5 bg-transparent outline-none text-xs md:text-sm font-bold text-slate-800 placeholder-slate-400">
                <button id="clear-search-btn" class="hidden absolute right-1 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">✕</button>
            </div>
            
            <div class="w-px h-6 bg-slate-200"></div>
            
            <button id="qr-mock-btn" class="p-2.5 text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors" title="Mô phỏng quét mã QR định vị trí hiện tại">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
        </div>

        <div id="search-suggestions" class="hidden w-full max-h-64 bg-white/95 backdrop-blur-md shadow-2xl rounded-2xl border border-slate-100 overflow-y-auto pointer-events-auto"></div>
    </div>

    <!-- SIDEBAR PANEL - Tối ưu hóa đa thiết bị mượt mà -->
    <aside id="main-sidebar" class="sidebar-panel fixed inset-y-0 left-0 w-80 md:w-80 bg-white border-r border-slate-200 flex flex-col shadow-2xl -translate-x-full lg:translate-x-0 lg:static lg:z-10">
        <div class="p-5 border-b border-slate-100 bg-gradient-to-br from-indigo-700 to-violet-900 text-white flex justify-between items-center">
            <div>
                <h1 class="font-bold text-base leading-tight">Indoor Nav PRO</h1>
                <p class="text-[9px] opacity-70 uppercase tracking-widest text-orange-300 font-bold">Advanced Smart Core v8.14</p>
            </div>
            <button id="close-sidebar-btn" class="p-1.5 text-white/60 hover:text-white rounded-lg hover:bg-white/10 lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            
            <!-- BỘ CHỈ ĐƯỜNG ĐỒNG BỘ CHUNG MỘT CHỖ (Google Maps/Grab Style) -->
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl relative shadow-sm space-y-3">
                <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider block">🔍 Thiết lập lộ trình</span>
                
                <!-- Trạng thái chặng di chuyển -->
                <div id="sidebar-route-status" class="hidden text-[10px] font-black text-indigo-600 bg-indigo-50 border border-indigo-100 p-2.5 rounded-xl text-center uppercase tracking-tight animate-pulse"></div>

                <div class="relative flex flex-col gap-3 pl-6">
                    <!-- Đường kẻ nét đứt nối hai vị trí -->
                    <div class="absolute left-3.5 top-4 bottom-4 w-px border-l-2 border-dashed border-slate-300"></div>
                    
                    <!-- Nhập điểm xuất phát -->
                    <div class="relative">
                        <div class="absolute -left-[19px] top-3.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-100"></div>
                        <span class="text-[8px] font-black text-slate-400 block uppercase mb-1">Điểm xuất phát</span>
                        <input id="sidebar-start-input" type="text" placeholder="Nhập điểm xuất phát..." class="w-full p-2.5 pr-6 bg-white border border-slate-200 rounded-xl text-xs font-black outline-none text-slate-800">
                        <button id="clear-sidebar-start-btn" class="hidden absolute right-2 top-1/2 translate-y-[10%] text-slate-400 hover:text-slate-600 font-bold text-xs">✕</button>
                        <div id="sidebar-start-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 max-h-48 bg-white/95 border border-slate-100 shadow-xl rounded-xl overflow-y-auto z-[250]"></div>
                    </div>
                    
                    <!-- Nhập điểm muốn đến -->
                    <div class="relative">
                        <div class="absolute -left-[19px] top-3.5 w-2.5 h-2.5 rounded-full bg-orange-500 ring-4 ring-orange-100"></div>
                        <span class="text-[8px] font-black text-slate-400 block uppercase mb-1">Điểm đến</span>
                        <input id="sidebar-end-input" type="text" placeholder="Nhập điểm muốn đến..." class="w-full p-2.5 pr-6 bg-white border border-slate-200 rounded-xl text-xs font-black outline-none text-slate-800">
                        <button id="clear-sidebar-end-btn" class="hidden absolute right-2 top-1/2 translate-y-[10%] text-slate-400 hover:text-slate-600 font-bold text-xs">✕</button>
                        <div id="sidebar-end-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 max-h-48 bg-white/95 border border-slate-100 shadow-xl rounded-xl overflow-y-auto z-[250]"></div>
                    </div>
                </div>
            </div>

            <div id="admin-tools" class="hidden space-y-3 bg-indigo-50/40 p-3 rounded-2xl border border-indigo-100">
                <div class="flex items-center justify-between border-b border-indigo-100 pb-2">
                    <span class="text-[9px] font-bold text-indigo-500 uppercase">Quản trị Hệ thống</span>
                    <button id="btn-logout" class="text-red-500 text-xs font-bold">Thoát</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button data-mode="select" class="tool-btn p-2 rounded-xl border border-transparent bg-indigo-600 text-white text-[9px] font-black uppercase">Kéo</button>
                    <button data-mode="add" class="tool-btn p-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-[9px] font-black uppercase">Thêm</button>
                    <button data-mode="connect" class="tool-btn p-2 rounded-xl border border-slate-200 bg-white text-slate-600 text-[9px] font-black uppercase">Nối</button>
                </div>
                <button id="btn-save-all" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-black shadow-lg hover:bg-indigo-700 transition-all">LƯU THAY ĐỔI SƠ ĐỒ</button>
            </div>

            <div class="space-y-1.5">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Tùy chọn di chuyển</span>
                <div class="grid grid-cols-2 gap-2 bg-slate-50 p-1 rounded-xl border border-slate-100">
                    <button id="pref-shortest" class="pref-btn py-1.5 text-[9px] font-black uppercase rounded-lg transition-all bg-white text-indigo-600 shadow-sm" data-pref="shortest">Gần Nhất</button>
                    <button id="pref-elevator" class="pref-btn py-1.5 text-[9px] font-black uppercase rounded-lg transition-all text-slate-500" data-pref="elevator">Ưu tiên 🛗</button>
                </div>
            </div>

            <div class="space-y-1.5">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Danh mục sơ đồ</span>
                <div id="floor-accordion-container" class="space-y-1.5"></div>
            </div>
        </div>
        
        <div class="p-4 bg-slate-50 border-t border-slate-100 text-[9px] text-slate-400 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span id="sync-status" class="w-2 h-2 rounded-full bg-yellow-500"></span>
                <span id="sync-text" class="font-bold uppercase text-[8px]">Connecting</span>
            </div>
            <span id="secret-login-trigger" class="font-bold uppercase text-[8px] cursor-pointer">v8.13 CLOUD</span>
        </div>
    </aside>

    <main id="viewport" class="flex-1 bg-slate-100 relative">
        <!-- ĐIỀU CHỈNH TOẠ ĐỘ: Nút zoom dời xuống top-20 trên mobile để chống đè lấp thanh search bar -->
        <div class="absolute right-4 top-20 lg:top-4 z-[140] flex flex-col gap-2">
            <button id="btn-rotate" class="p-3 bg-white/95 shadow-lg rounded-xl border border-slate-100 text-slate-600 active:scale-90 transition-transform" title="Xoay sơ đồ 90°">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
            </button>
            <button id="btn-recenter" class="p-3 bg-white/95 shadow-lg rounded-xl border border-slate-100 text-slate-600 active:scale-90 transition-transform" title="Căn giữa sơ đồ">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>

        <div id="map-container" class="bg-white shadow-2xl rounded-xl overflow-visible">
            <img id="map-image" src="" alt="Sơ đồ tòa nhà" class="w-full h-full object-fill rounded-xl pointer-events-none transition-all duration-300">
            <svg id="svg-layer" class="absolute inset-0 w-full h-full pointer-events-none overflow-visible"></svg>
            <div id="nodes-layer" class="absolute inset-0 pointer-events-none"></div>
        </div>

        <div id="route-summary-card" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-sm bg-white/95 backdrop-blur-md border border-slate-100/50 shadow-2xl p-4 rounded-2xl z-[150] flex flex-col gap-2 transition-all duration-300">
            <div class="flex items-center justify-between border-b pb-2">
                <div class="flex items-center gap-2">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                    </span>
                    <span class="text-[9px] font-black uppercase text-orange-500 tracking-wider">Đang chỉ đường</span>
                </div>
                <button id="btn-cancel-route-fast" class="text-slate-400 hover:text-red-500 text-[10px] font-black uppercase">✕ Hủy tuyến</button>
            </div>
            <div class="flex items-center justify-between gap-4">
                <div class="min-w-0">
                    <p class="text-[9px] text-slate-400 font-bold uppercase">Điểm đến</p>
                    <p id="route-summary-dest" class="text-xs font-black text-slate-800 truncate">PHÒNG A0.11</p>
                </div>
                <div class="text-right">
                    <p class="text-[9px] text-slate-400 font-bold uppercase">Ước lượng</p>
                    <p id="route-summary-steps" class="text-xs font-black text-indigo-600 whitespace-nowrap">~45 bước</p>
                </div>
            </div>
            <button id="btn-route-switch-floor-fast" class="hidden w-full py-2 mt-1 bg-indigo-50 text-indigo-600 rounded-lg text-[10px] font-black uppercase transition-all">Chuyển sang tầng tiếp theo</button>
        </div>

        <div id="quick-actions-bar" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-[130] w-11/12 max-w-sm bg-white/90 backdrop-blur-md shadow-2xl rounded-2xl p-2 flex justify-around items-center border border-white/20 transition-all duration-300">
            <button class="quick-action-btn flex flex-col items-center p-2 text-slate-600 hover:text-indigo-600 transition-colors" data-type="wc">
                <span class="text-lg md:text-xl">🚻</span><span class="text-[8px] md:text-[9px] font-bold uppercase">WC</span>
            </button>
            <button class="quick-action-btn flex flex-col items-center p-2 text-slate-600 hover:text-indigo-600 transition-colors" data-type="canteen">
                <span class="text-lg md:text-xl">☕</span><span class="text-[8px] md:text-[9px] font-bold uppercase">Căn tin</span>
            </button>
            <button class="quick-action-btn flex flex-col items-center p-2 text-slate-600 hover:text-indigo-600 transition-colors" data-type="library">
                <span class="text-lg md:text-xl">📚</span><span class="text-[8px] md:text-[9px] font-bold uppercase">T.Viện</span>
            </button>
            <button class="quick-action-btn flex flex-col items-center p-2 text-slate-600 hover:text-indigo-600 transition-colors" data-type="elevator">
                <span class="text-lg md:text-xl">🛗</span><span class="text-[8px] md:text-[9px] font-bold uppercase">Thang máy</span>
            </button>
            <button id="quick-recenter-btn" class="flex flex-col items-center p-2 text-slate-600 hover:text-indigo-600 transition-colors">
                <span class="text-lg md:text-xl">📍</span><span class="text-[8px] md:text-[9px] font-bold uppercase">Mặc định</span>
            </button>
        </div>

        <div id="next-floor-prompt" class="hidden absolute bottom-24 left-1/2 -translate-x-1/2 bg-white border border-indigo-100 shadow-2xl p-3.5 rounded-2xl flex items-center gap-3.5 animate-bounce z-50">
            <p id="prompt-text" class="text-[10px] font-black text-slate-800 uppercase tracking-tight">Tiếp theo: Tầng X</p>
            <button id="btn-switch-floor" class="bg-orange-500 text-white px-3.5 py-2 rounded-lg text-[10px] font-black shadow-lg hover:bg-orange-600 transition-colors">CHUYỂN TẦNG</button>
        </div>
    </main>

    <div id="login-modal" class="hidden fixed inset-0 z-[300] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-xs text-center space-y-4 border">
            <h2 class="text-xs font-black uppercase text-slate-800 tracking-wider">Xác thực Quản trị</h2>
            <input id="admin-password" type="password" placeholder="Mật khẩu" class="w-full p-3 bg-slate-50 border rounded-xl text-center outline-none focus:ring-2 focus:ring-indigo-500 font-bold tracking-widest text-slate-800">
            <div class="flex gap-2">
                <button id="btn-login-cancel" class="flex-1 py-2.5 text-slate-400 text-xs font-bold hover:bg-slate-50 rounded-lg">Hủy</button>
                <button id="btn-login-confirm" class="flex-1 py-2.5 bg-indigo-600 text-white text-xs font-bold rounded-lg shadow-md">OK</button>
            </div>
        </div>
    </div>

    <div id="props-panel" class="hidden absolute bottom-24 right-4 md:top-4 md:right-4 w-[280px] bg-white rounded-2xl shadow-2xl border p-4 space-y-4 z-[160]">
        <div class="flex justify-between items-center border-b pb-2">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Cấu hình Điểm</span>
            <button id="btn-close-props" class="text-slate-300 hover:text-slate-600">✕</button>
        </div>
        <div class="space-y-1">
            <label class="text-[9px] font-bold text-slate-400 uppercase">Tên Node/Phòng</label>
            <input id="node-label-input" type="text" class="w-full p-2 bg-slate-50 border text-slate-800 rounded-lg text-xs font-bold outline-none">
        </div>
        <div class="space-y-1">
            <label class="text-[9px] font-bold text-slate-400 uppercase">Khoa / Phòng Ban</label>
            <input id="node-dept-input" type="text" placeholder="Ví dụ: Công nghệ thông tin" class="w-full p-2 bg-slate-50 border text-slate-800 rounded-lg text-xs outline-none">
        </div>
        <div class="space-y-2">
            <label class="text-[9px] font-bold text-slate-400 uppercase">Phân loại & Định dạng màu</label>
            <div class="grid grid-cols-2 gap-1.5">
                <button id="btn-type-classroom" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">🟢 PHÒNG HỌC</button>
                <button id="btn-type-office" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">🟣 VĂN PHÒNG</button>
                <button id="btn-type-service" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">🟡 DỊCH VỤ</button>
                <button id="btn-type-emergency" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">🔴 KHẨN CẤP</button>
                <button id="btn-type-waypoint" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">⚪ ĐIỂM NỐI</button>
                <button id="btn-type-transition" class="type-opt p-2 border rounded-lg text-[9px] font-black text-left">🔵 CẦU THANG</button>
            </div>
        </div>
        
        <!-- BẢNG LIÊN KẾT ĐẦU NỐI (Chỉ dành riêng cho Cầu thang/Thang máy) -->
        <div id="props-panel-transition-link" class="space-y-1 hidden">
            <label class="text-[9px] font-bold text-slate-400 uppercase">Liên kết tới Node lầu khác</label>
            <select id="node-connected-select" class="w-full p-2.5 bg-slate-50 border text-slate-800 rounded-lg text-xs outline-none font-bold"></select>
        </div>

        <div class="space-y-2">
            <label class="text-[9px] font-bold text-slate-400 uppercase">Biểu tượng chức năng</label>
            <div class="grid grid-cols-4 gap-1">
                <button data-icon="🚻" class="icon-opt border p-1 rounded text-center text-xs">🚻</button>
                <button data-icon="☕" class="icon-opt border p-1 rounded text-center text-xs">☕</button>
                <button data-icon="📚" class="icon-opt border p-1 rounded text-center text-xs">📚</button>
                <button data-icon="🛗" class="icon-opt border p-1 rounded text-center text-xs">🛗</button>
                <button data-icon="🪜" class="icon-opt border p-1 rounded text-center text-xs">🪜</button>
                <button data-icon="🚪" class="icon-opt border p-1 rounded text-center text-xs">🚪</button>
                <button data-icon="🚨" class="icon-opt border p-1 rounded text-center text-xs">🚨</button>
                <button data-icon="" class="icon-opt border p-1 rounded text-center text-[9px] font-bold">Xóa</button>

    function removeVietnameseTones(str) {
        str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
        str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
        str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
        str = str.replace(/ò|ó|ọ|ỏ|ã|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
        str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
        str = str.replace(/ỳ|á|ỵ|ỷ|ỹ/g, "y");
        str = str.replace(/đ/g, "d");
        return str.toLowerCase().trim();
    }

    function normalizeTypo(str) {

    function sanitizeConnections() {
        Object.values(nodes).forEach(n => {
            n.connections = [];

            if(!n.dept) n.dept = '';

        });
        edges.forEach(([id1, id2]) => {

    async function saveData(silent = false) {
        if (!user) return;

    // TỐI ƯU HÓA: Cho phép tìm đường trực tiếp xuyên biên giới các Khu nếu chúng chung một ảnh sơ đồ (mặt bằng ngang)
    function findShortestPath(startId, targetIdOrPredicate) {
        let q = [[startId]], visited = new Set();
        while(q.length > 0) {
            const path = q.shift();
            const currId = path[path.length - 1];
            const currNode = nodes[currId];
            if (!currNode) continue;

            const isTarget = typeof targetIdOrPredicate === 'function' 
                ? targetIdOrPredicate(currNode) 
                : currId === targetIdOrPredicate;

            if (isTarget) return path;

            if (!visited.has(currId)) {
                visited.add(currId);
                const conns = currNode.connections || [];
                conns.forEach(nId => {
                    if (nodes[nId] && getFloorImage(nodes[nId].floor) === getFloorImage(currNode.floor)) {
                        if (routingPref === 'elevator' && nodes[nId].type === 'stairs') return;
                        q.push([...path, nId]);
                    }
                });
            }
        }
        return null;
    }

    // THUẬT TOÁN TÍNH TOÁN DANH SÁCH CHUỖI CÁC TẦNG ĐI QUA (Hỗ trợ định tuyến tuần tự)
    function getFloorSequence(startFloor, endFloor) {
        if (startFloor === endFloor) return [startFloor];
        
        const startArea = startFloor.split('-')[0];
        const endArea = endFloor.split('-')[0];
        
        const areaOrders = {
            'A': ['A-G', 'A-1', 'A-2'],
            'B': ['B-G', 'B-1', 'B-2', 'B-3', 'B-4'],
            'C': ['C-G'],
            'D': ['D-G']
        };

        if (startArea === endArea) {
            const list = areaOrders[startArea] || [];
            const startIdx = list.indexOf(startFloor);
            const endIdx = list.indexOf(endFloor);
            if (startIdx === -1 || endIdx === -1) return [startFloor, endFloor];
            
            const seq = [];
            if (startIdx <= endIdx) {
                for (let i = startIdx; i <= endIdx; i++) seq.push(list[i]);
            } else {
                for (let i = startIdx; i >= endIdx; i--) seq.push(list[i]);
            }
            return seq;
        } else {
            // Trường hợp liên khu vực (VD: Từ lầu 1 Khu A sang lầu 3 Khu B -> Đi xuống trệt A, sang trệt B, đi lên lầu 3 B)
            const toGround = areaOrders[startArea] ? areaOrders[startArea][0] : startFloor;
            const fromGround = areaOrders[endArea] ? areaOrders[endArea][0] : endFloor;
            
            const leg1 = getFloorSequence(startFloor, toGround);
            const leg2 = getFloorSequence(fromGround, endFloor);
            
            const combined = [...leg1];
            leg2.forEach(f => {
                if (combined[combined.length - 1] !== f) {
                    combined.push(f);
                }
            });
            return combined;
        }
    }

    // TÌM CẦU THANG/THANG MÁY KẾT NỐI TỐI ƯU NHẤT GIỮA HAI TẦNG KỀ NHAU (Dựa trên quãng đường và vị trí XY)
    function findBestTransition(fromFloor, toFloor, fromNodeId, finalDestNodeId) {
        const startNode = nodes[fromNodeId];
        if (!startNode) return null;
        
        const candidates = Object.values(nodes).filter(n => n.floor === fromFloor && (n.type === 'stairs' || n.type === 'elevator' || n.type === 'transition'));
        let bestTransitionStart = null;
        let bestTransitionEnd = null;
        let bestScore = Infinity; 
        
        // Bản đồ cặp kết nối tĩnh làm Fallback khẩn cấp
        const transitionPairs = {
           "n_stairs_dong_G": "n_stairs_dong_1",
           "n_stairs_dong_1": "n_stairs_dong_G",
           "n_stairs_tay_G": "n_stairs_tay_1",
           "n_stairs_tay_1": "n_stairs_tay_G"
        };

        candidates.forEach(tStartNode => {
            const matchingEnds = Object.values(nodes).filter(n => n.floor === toFloor && (n.type === tStartNode.type || n.type === 'transition' || n.type === 'stairs' || n.type === 'elevator'));
            if (matchingEnds.length === 0) return;
            
            // Đối khớp điểm đích chuyển tiếp bằng (1) connectedNode cấu hình từ admin, hoặc (2) hardcoded transitionPairs, hoặc (3) Khoảng cách XY gần nhất
            let closestEndNode = null;
            if (tStartNode.connectedNode && nodes[tStartNode.connectedNode] && nodes[tStartNode.connectedNode].floor === toFloor) {
                closestEndNode = nodes[tStartNode.connectedNode];
            } else if (transitionPairs[tStartNode.id] && nodes[transitionPairs[tStartNode.id]] && nodes[transitionPairs[tStartNode.id]].floor === toFloor) {
                closestEndNode = nodes[transitionPairs[tStartNode.id]];
            } else {
                let minDistance = Infinity;
                matchingEnds.forEach(tEndNode => {
                    const dx = tStartNode.x - tEndNode.x;
                    const dy = tStartNode.y - tEndNode.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestEndNode = tEndNode;
                    }
                });
            }
            
            if (!closestEndNode) return;
            
            // Tính điểm tối ưu: Tổng số bước đi tới thang hiện tại + Ước lượng khoảng cách từ thang đích đến phòng cuối cùng
            const path1 = findShortestPath(fromNodeId, tStartNode.id);
            if (path1) {
                const destNode = nodes[finalDestNodeId];
                let distToDest = 0;
                if (destNode) {
                    const dx = closestEndNode.x - destNode.x;
                    const dy = closestEndNode.y - destNode.y;
                    distToDest = Math.sqrt(dx * dx + dy * dy);
                }
                const score = path1.length + distToDest / 50; 
                if (score < bestScore) {
                    bestScore = score;
                    bestTransitionStart = tStartNode;
                    bestTransitionEnd = closestEndNode;
                }
            }
        });
        
        if (bestTransitionStart && bestTransitionEnd) {
            return { start: bestTransitionStart, end: bestTransitionEnd };
        }
        return null;
    }

    // ĐỘNG CƠ CẬP NHẬT TUYẾN ĐƯỜNG ĐA TẦNG TUẦN TỰ (Sequential Route State Updater)
    // TỐI ƯU: Nhóm các khu vực nằm cùng một mặt phẳng ngang (Trệt) để hiển thị lộ trình đi bộ ngang trước khi chuyển tầng.
    function updateRouteAndUI() {
        if (!localStartId || !localEndId) {
            route = [];
            crossFloorRouting = null;
            navigationActive = false;
            hideRouteSummaryUI();
            updateUI();
            return;
        }

        const S = nodes[localStartId];
        const E = nodes[localEndId];
        if (!S || !E) return;

        // Khởi tạo tiến trình dẫn đường ảo tuần tự nếu mới bắt đầu hoặc đổi điểm đích
        if (!navigationActive || navigationTargetNodeId !== localEndId) {
            navigationActive = true;
            navigationCurrentNodeId = localStartId;
            navigationTargetNodeId = localEndId;
            floorSequence = getFloorSequence(S.floor, E.floor);
        }

        const currentNavNode = nodes[navigationCurrentNodeId];
        if (!currentNavNode) return;

        const navFloor = currentNavNode.floor;
        const currentFloorIdx = floorSequence.indexOf(navFloor);

        route = [];
        crossFloorRouting = null;

        // Đảm bảo màn hình hiển thị (map viewed floor) nhảy mượt mà về đúng tầng mà người dùng đang đứng ảo trong hành trình
        if (currentFloorId !== navFloor) {
            currentFloorId = navFloor;
            updateUI(); 
            return; // Dừng lại để đợi map load xong ảnh của tầng mới rồi chạy lại
        }

        const currentMapImage = getFloorImage(navFloor);
        const targetMapImage = getFloorImage(E.floor);

        if (currentMapImage === targetMapImage) {
            // Đã cùng mặt phẳng sơ đồ hiển thị (vd: cùng nằm trên sơ đồ trệt chung), vẽ đường đi trực tiếp ngang
            route = findShortestPath(navigationCurrentNodeId, localEndId) || [];
        } else {
            // Khác mặt phẳng sơ đồ, cần tìm điểm thang gần nhất để chuyển tầng tiếp theo trong sequence
            let nextMapFloor = null;
            for (let i = currentFloorIdx + 1; i < floorSequence.length; i++) {
                if (getFloorImage(floorSequence[i]) !== currentMapImage) {
                    nextMapFloor = floorSequence[i];
                    break;
                }
            }

            if (nextMapFloor) {
                // Liệt kê mọi tầng cùng dùng chung sơ đồ hiển thị này (vd: A-G, B-G, C-G, D-G)
                const sameMapFloors = floors.filter(f => f.image === currentMapImage).map(f => f.id);
                
                let bestTransition = null;
                let bestScore = Infinity;

                sameMapFloors.forEach(fId => {
                    const trans = findBestTransition(fId, nextMapFloor, navigationCurrentNodeId, localEndId);
                    if (trans) {
                        const path = findShortestPath(navigationCurrentNodeId, trans.start.id);
                        if (path) {
                            const score = path.length;
                            if (score < bestScore) {
                                bestScore = score;
                                bestTransition = trans;
                            }
                        }
                    }
                });

                if (bestTransition) {
                    route = findShortestPath(navigationCurrentNodeId, bestTransition.start.id) || [];
                    crossFloorRouting = {
                        startFloor: bestTransition.start.floor,
                        endFloor: bestTransition.end.floor,
                        transitionStartId: bestTransition.start.id,
                        transitionEndId: bestTransition.end.id
                    };
                }
            }
        }

        renderEdges();
        renderNodes();
        checkNextFloorPrompt();
        autoFocusRoute();
    }

    function clamp(val, min, max) {
        return Math.min(Math.max(val, min), max);
    }

    // TỐI ƯU CỰC MẠNH MOBILE: Mở rộng biên kéo tối đa theo khung xoay thực tế, chống bị lock cứng khi xoay bản đồ, giúp vuốt kéo xem được toàn phần bản đồ dễ dàng ở mọi góc xoay
    function limitBounds() {
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const visibleWidth = vW - sidebarWidth;

        // Cho phép thu phóng tự do hơn, không bị khóa cứng tỉ lệ nhỏ
        const minScaleX = (visibleWidth * 0.4) / MAP_WIDTH; 
        const minScaleY = (vH * 0.4) / MAP_HEIGHT;
        const minScale = Math.max(Math.min(minScaleX, minScaleY), 0.12);
        
        if (view.scale < minScale) {
            view.scale = minScale;
        }
        if (view.scale > 5.0) {
            view.scale = 5.0;
        }

        // Tính toán bốn góc của bản đồ sau khi xoay để tìm khung bao (bounding box) thực tế của sơ đồ
        const rad = view.rotation * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const corners = [
            { x: 0, y: 0 },
            { x: MAP_WIDTH, y: 0 },
            { x: MAP_WIDTH, y: MAP_HEIGHT },
            { x: 0, y: MAP_HEIGHT }
        ];

        let minRx = Infinity, maxRx = -Infinity;
        let minRy = Infinity, maxRy = -Infinity;

        corners.forEach(c => {
            const rx = (c.x * cos - c.y * sin) * view.scale;
            const ry = (c.x * sin + c.y * cos) * view.scale;
            if (rx < minRx) minRx = rx;
            if (rx > maxRx) maxRx = rx;
            if (ry < minRy) minRy = ry;
            if (ry > maxRy) maxRy = ry;
        });

        // BIÊN TỰ DO THÔNG THOÁNG CHỐNG TRÔI KHI XOAY:
        // Người dùng thoải mái vuốt ngang dọc để duyệt bản đồ sau khi xoay, chỉ cần giữ lại ít nhất 100px của sơ đồ trên màn hình hiển thị
        const minX = sidebarWidth - maxRx + 100;
        const maxX = vW - minRx - 100;
        const minY = -maxRy + 100;
        const maxY = vH - minRy - 100;

        view.x = clamp(view.x, Math.min(minX, maxX), Math.max(minX, maxX));
        view.y = clamp(view.y, Math.min(minY, maxY), Math.max(minY, maxY));
    }

    // NÂNG CẤP TRANSITION: Chỉ dùng hiệu ứng mượt khi auto-center, tắt khi vuốt tay để phản hồi vuốt mượt lập tức không bị lag giật
    function applyTransform(smooth = false) { 
        limitBounds();
        if (smooth) {
            mapContainer.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
        } else {
            mapContainer.style.transition = 'none';
        }
        mapContainer.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale}) rotate(${view.rotation}deg)`; 
    }

    // TỐI ƯU CĂN TÂM TUYỆT ĐỐI CHO SƠ ĐỒ XOAY: Định vị sơ đồ luôn ở chính giữa trung tâm màn hình dù ở bất kỳ góc xoay nào
    function setupInitialView() {
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        
        // Tránh lỗi khởi động kích thước 0
        if (vW < 50 || vH < 50) {
            setTimeout(setupInitialView, 50);
            return;
        }

        const visibleWidth = vW - sidebarWidth;
        
        // Tính toán kích thước bao của bản đồ dựa trên góc xoay hiện tại
        const rad = view.rotation * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const corners = [
            { x: 0, y: 0 },
            { x: MAP_WIDTH, y: 0 },
            { x: MAP_WIDTH, y: MAP_HEIGHT },
            { x: 0, y: MAP_HEIGHT }
        ];

        let minRx = Infinity, maxRx = -Infinity;
        let minRy = Infinity, maxRy = -Infinity;

        corners.forEach(c => {
            const rx = (c.x * cos - c.y * sin);
            const ry = (c.x * sin + c.y * cos);
            if (rx < minRx) minRx = rx;
            if (rx > maxRx) maxRx = rx;
            if (ry < minRy) minRy = ry;
            if (ry > maxRy) maxRy = ry;
        });

        const rotatedWidth = maxRx - minRx;
        const rotatedHeight = maxRy - minRy;

        // Mobile cực ít padding để tối ưu không gian màn hình nhỏ
        const pad = window.innerWidth < 768 ? 16 : 40;
        const sX = (visibleWidth - pad) / rotatedWidth;
        const sY = (vH - pad) / rotatedHeight;
        
        view.scale = Math.min(sX, sY, 1.5);
        
        // ĐỊNH TÂM TUYỆT ĐỐI: Căn khớp hoàn hảo tâm bao sơ đồ xoay với tâm màn hình hiển thị
        const vcX = sidebarWidth + visibleWidth / 2;
        const vcY = vH / 2;
        
        const mapCenterRx = (minRx + maxRx) / 2 * view.scale;
        const mapCenterRy = (minRy + maxRy) / 2 * view.scale;

        view.x = vcX - mapCenterRx;
        view.y = vcY - mapCenterRy;
        
        applyTransform(true); // Animate mượt mà về tâm
        renderNodes();
    }

    // TỐI ƯU CĂN TÂM TUYỆT ĐỐI KHI TỰ ĐỘNG FOCUS LỘ TRÌNH XOAY
    function autoFocusRoute() {
        if(route.length === 0) return;
        const currentFloorIdVal = currentFloorId;
        const currentFloorObj = floors.find(x => x.id === currentFloorIdVal);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';

        // Tối ưu auto focus: Lấy tất cả nodes trên tuyến đường có chung hình ảnh sơ đồ đang hiển thị
        const currentFloorNodes = route.map(id => nodes[id]).filter(n => {
            if (!n) return false;
            const fObj = floors.find(x => x.id === n.floor);
            return fObj && fObj.image === currentMapImage;
        });
        
        if(currentFloorNodes.length === 0) return;

        let minX = MAP_WIDTH, maxX = 0, minY = MAP_HEIGHT, maxY = 0;
        currentFloorNodes.forEach(n => {
            if(n.x < minX) minX = n.x; if(n.x > maxX) maxX = n.x;
            if(n.y < minY) minY = n.y; if(n.y > maxY) maxY = n.y;
        });

        const midX = (minX + maxX) / 2;
        const midY = (minY + maxY) / 2;

        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const visibleWidth = vW - sidebarWidth;

        const routeW = Math.max(maxX - minX, 100);
        const routeH = Math.max(maxY - minY, 100);
        const scaleX = (visibleWidth - 60) / routeW;
        const scaleY = (vH - 240) / routeH; 
        
        view.scale = Math.min(scaleX, scaleY, 2.2);

        // Định tâm trung điểm chặng đường đã xoay với tâm màn hình hiển thị
        const rad = view.rotation * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const rx = (midX * cos - midY * sin) * view.scale;
        const ry = (midX * sin + midY * cos) * view.scale;

        const vcX = sidebarWidth + visibleWidth / 2;
        const vcY = vH / 2;

        view.x = vcX - rx;
        view.y = vcY - ry;
        
        applyTransform(true);
        renderNodes();
    }

    function focusSingleNode(node) {
        if (!node) return;
        const sidebarWidth = (window.innerWidth >= 1024 && !sidebar.classList.contains('-translate-x-full')) ? sidebar.clientWidth : 0;
        const vW = viewport.clientWidth || window.innerWidth;
        const vH = viewport.clientHeight || window.innerHeight;
        const visibleWidth = vW - sidebarWidth;

        view.scale = 2.0;
        view.x = sidebarWidth + (visibleWidth / 2) - node.x * view.scale;
        view.y = (vH / 2) - node.y * view.scale;
        applyTransform(true);
        renderNodes();
    }

    function toggleSidebar(show) {
        if (show) {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        } else {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }
        setTimeout(() => setupInitialView(), 310);
    }

    function updateUI() {
        const accordionContainer = document.getElementById('floor-accordion-container');
        accordionContainer.innerHTML = '';
        
        const areas = [...new Set(floors.map(f => f.area))];
        areas.forEach((area, index) => {
            const isCurrentArea = floors.find(f => f.id === currentFloorId)?.area === area;

            const groupDiv = document.createElement('div');
            groupDiv.className = "bg-slate-50 rounded-xl overflow-hidden border border-slate-100";
            
            groupDiv.innerHTML = `
                <button class="w-full flex items-center justify-between p-3 text-left font-black text-[10px] text-slate-700 uppercase tracking-wide bg-slate-100/70">
                    <span>🏢 ${area}</span>
                    <span class="transform transition-transform text-[8px] ${isCurrentArea ? 'rotate-180' : ''}">▼</span>
                </button>
                <div class="accordion-content ${isCurrentArea ? 'block' : 'hidden'} p-1 space-y-1"></div>
            `;

            const btnHeader = groupDiv.querySelector('button');
            const contentDiv = groupDiv.querySelector('.accordion-content');

            btnHeader.onclick = () => {
                const isHidden = contentDiv.classList.contains('hidden');
                document.querySelectorAll('.accordion-content').forEach(c => c.classList.add('hidden'));
                groupDiv.parentNode.querySelectorAll('button span:last-child').forEach(s => s.classList.remove('rotate-180'));
                
                if(isHidden) {
                    contentDiv.classList.remove('hidden');
                    btnHeader.querySelector('span:last-child').classList.add('rotate-180');
                } else {
                    contentDiv.classList.add('hidden');
                }
            };

            floors.filter(f => f.area === area).forEach(f => {
                const fBtn = document.createElement('button');
                fBtn.className = `w-full flex items-center justify-between p-2.5 rounded-lg text-[10px] font-bold uppercase transition-all ${currentFloorId === f.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200/50'}`;
                fBtn.innerHTML = `<span>${f.name}</span>`;
                fBtn.onclick = () => window.changeFloor(f.id);
                contentDiv.appendChild(fBtn);
            });

            accordionContainer.appendChild(groupDiv);
        });
        
        const currentFloor = floors.find(x => x.id === currentFloorId);
        if (mapImage.getAttribute('src') !== currentFloor.image) {
            mapImage.src = currentFloor.image;
        }

        renderNodes(); 
        renderEdges(); 
        checkNextFloorPrompt();
    }

    window.changeFloor = (id) => { 
        currentFloorId = id; 
        updateUI(); 
    };

    function buildQrLocationSelector() {
        if (!localStartId && nodes["n_cong"]) {
            localStartId = "n_cong";
            localStorage.setItem('ind_local_start_id', 'n_cong');
        }
        
        const activeStartNodeId = navigationActive ? navigationCurrentNodeId : localStartId;
        if (activeStartNodeId && nodes[activeStartNodeId]) {
            const startLabel = nodes[activeStartNodeId].label.toUpperCase();
            searchInput.value = startLabel;
            sidebarStartInput.value = startLabel;
            
            document.getElementById('clear-search-btn').classList.remove('hidden');
            clearSidebarStartBtn.classList.remove('hidden');
        } else {
            searchInput.value = "";
            sidebarStartInput.value = "";
            
            document.getElementById('clear-search-btn').classList.add('hidden');
            clearSidebarStartBtn.classList.add('hidden');
        }

        if (localEndId && nodes[localEndId]) {
            sidebarEndInput.value = nodes[localEndId].label.toUpperCase();
            clearSidebarEndBtn.classList.remove('hidden');
        } else {
            sidebarEndInput.value = "";
            clearSidebarEndBtn.classList.add('hidden');
        }
    }

    // TỐI ƯU HÓA: Cố định vị trí hiển thị ở tầng xuất phát khi gán điểm đến bằng ô nhập sidebar gợi ý (Không tự động nhảy tầng đích đột ngột)
    function showLocationSuggestions(filterText, suggestionsContainer, inputRole) {
        const value = normalizeTypo(filterText);
        
        const validNodes = Object.values(nodes || {}).filter(n => {
            if (!n || !n.label || n.type === 'waypoint') return false;
            return floors.some(f => f.id === n.floor); 
        });
        
        const matches = validNodes.filter(n => {
            const labelNorm = normalizeTypo(n.label);
            const deptNorm = normalizeTypo(n.dept || '');
            return labelNorm.includes(value) || deptNorm.includes(value);
        });

        const uniqueMatches = [];
        const seenKeys = new Set();
        matches.forEach(n => {
            const key = `${n.label.toUpperCase()}_${n.floor}`;
            if (!seenKeys.has(key)) {
                seenKeys.add(key);
                uniqueMatches.push(n);
            }
        });

        if (uniqueMatches.length > 0) {
            suggestionsContainer.innerHTML = '';
            suggestionsContainer.classList.remove('hidden');
            uniqueMatches.forEach(n => {
                const floorObj = floors.find(f => f.id === n.floor); 
                if (!floorObj) return; // An toàn lọc bỏ Khu - Tầng rác
                const item = document.createElement('div');
                item.className = "p-3 border-b border-slate-100 last:border-none cursor-pointer hover:bg-slate-50 flex justify-between items-center text-xs text-slate-800 font-bold transition-colors";
                item.innerHTML = `
                    <div class="pointer-events-none">
                        <span class="uppercase text-indigo-600">${n.customIcon || '📍'} ${n.label}</span>
                        ${n.dept ? `<span class="text-[9px] text-slate-400 block font-medium">${n.dept}</span>` : ''}
                    </div>
                    <span class="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-black pointer-events-none">${floorObj.area} - ${floorObj.name}</span>
                `;
                item.onclick = (e) => {
                    e.stopPropagation();
                    
                    if (inputRole === 'start') {
                        localStartId = n.id;
                        localStorage.setItem('ind_local_start_id', n.id);
                        navigationActive = false; // Reset lại định tuyến mới
                        
                        showMsg("Đã đặt vị trí hiện tại: " + n.label.toUpperCase());
                        
                        // Chuyển tầng sơ đồ hiển thị khớp với điểm xuất phát
                        currentFloorId = n.floor;
                        
                        if (localEndId && localEndId !== n.id) {
                            updateRouteAndUI();
                        } else {
                            updateUI();
                            focusSingleNode(n);
                            setTimeout(() => {
                                sidebarEndInput.focus();
                                showLocationSuggestions("", sidebarEndSuggestions, 'end');
                            }, 400);
                        }
                    } else if (inputRole === 'end') {
                        localEndId = n.id;
                        navigationActive = false; // Reset định tuyến mới
                        
                        if (!localStartId) {
                            localStartId = "n_cong";
                            localStorage.setItem('ind_local_start_id', 'n_cong');
                        }

                        showMsg("Đang vẽ tuyến đường đến: " + n.label.toUpperCase());
                        
                        // Gọi updateRouteAndUI() để định tuyến từ điểm đầu tiên
                        updateRouteAndUI();
                        showRouteSummaryUI(localEndId);
                    }

                    buildQrLocationSelector();
                    suggestionsContainer.classList.add('hidden');
                };
                suggestionsContainer.appendChild(item);
            });
        } else {
            suggestionsContainer.classList.add('hidden');
        }
    }

    // 1. Ô tìm kiếm chính bên ngoài
    searchInput.oninput = (e) => {
        const rawValue = e.target.value;
        const value = normalizeTypo(rawValue);
        const clearBtn = document.getElementById('clear-search-btn');

        if(value.length > 0) clearBtn.classList.remove('hidden');
        else { 
            clearBtn.classList.add('hidden'); 
            suggestionsBox.classList.add('hidden'); 
            return; 
        }

        showLocationSuggestions(rawValue, suggestionsBox, 'start');
    };

    searchInput.onfocus = () => {
        showLocationSuggestions(searchInput.value, suggestionsBox, 'start');
    };

    document.getElementById('clear-search-btn').onclick = () => {
        searchInput.value = '';
        localStartId = '';
        localStorage.removeItem('ind_local_start_id');
        buildQrLocationSelector();
        document.getElementById('clear-search-btn').classList.add('hidden');
        suggestionsBox.classList.add('hidden');
        if (route.length > 0 || navigationActive) {
            document.getElementById('btn-cancel-route-fast').click();
        }
    };

    // 2. Ô nhập Xuất Phát trong Sidebar
    sidebarStartInput.oninput = (e) => {
        const rawValue = e.target.value;
        const value = normalizeTypo(rawValue);
        if(value.length > 0) clearSidebarStartBtn.classList.remove('hidden');
        else {
            clearSidebarStartBtn.classList.add('hidden');
            sidebarStartSuggestions.classList.add('hidden');
            return;
        }
        showLocationSuggestions(rawValue, sidebarStartSuggestions, 'start');
    };

    sidebarStartInput.onfocus = () => {
        showLocationSuggestions(sidebarStartInput.value, sidebarStartSuggestions, 'start');
    };

    clearSidebarStartBtn.onclick = () => {
        sidebarStartInput.value = '';
        localStartId = '';
        localStorage.removeItem('ind_local_start_id');
        buildQrLocationSelector();
        clearSidebarStartBtn.classList.add('hidden');
        sidebarStartSuggestions.classList.add('hidden');
        if (route.length > 0 || navigationActive) {
            document.getElementById('btn-cancel-route-fast').click();
        }
    };

    // 3. Ô nhập Đích Đến trong Sidebar
    sidebarEndInput.oninput = (e) => {
        const rawValue = e.target.value;
        const value = normalizeTypo(rawValue);
        if(value.length > 0) clearSidebarEndBtn.classList.remove('hidden');
        else {
            clearSidebarEndBtn.classList.add('hidden');
            sidebarEndSuggestions.classList.add('hidden');
            return;
        }
        showLocationSuggestions(rawValue, sidebarEndSuggestions, 'end');
    };

    sidebarEndInput.onfocus = () => {
        showLocationSuggestions(sidebarEndInput.value, sidebarEndSuggestions, 'end');
    };

    clearSidebarEndBtn.onclick = () => {
        sidebarEndInput.value = '';
        localEndId = null;
        buildQrLocationSelector();
        clearSidebarEndBtn.classList.add('hidden');
        sidebarEndSuggestions.classList.add('hidden');
        if (route.length > 0 || navigationActive) {
            document.getElementById('btn-cancel-route-fast').click();
        }
    };

    // Đóng danh sách gợi ý khi click ra ngoài
    document.addEventListener('click', (e) => {
        if (e.target !== searchInput && !e.target.closest('#search-suggestions')) {
            suggestionsBox.classList.add('hidden');
        }
        if (e.target !== sidebarStartInput && !e.target.closest('#sidebar-start-suggestions')) {
            sidebarStartSuggestions.classList.add('hidden');
        }
        if (e.target !== sidebarEndInput && !e.target.closest('#sidebar-end-suggestions')) {
            sidebarEndSuggestions.classList.add('hidden');
        }
    });

    // TỐI ƯU HÓA: Hiển thị đồng thời các điểm thuộc các khu vực khác nhau nhưng có chung một tệp ảnh sơ đồ nền
    function renderNodes() {
        nodesLayer.innerHTML = '';
        const isRouteActive = route.length > 0;
        const scale = view.scale;

        mapImage.classList.remove('dimmed-map');

        const currentFloorObj = floors.find(x => x.id === currentFloorId);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';

        Object.values(nodes).filter(n => {
            const fObj = floors.find(x => x.id === n.floor);
            return fObj && fObj.image === currentMapImage;
        }).forEach(node => {
            const isSelected = selectedId === node.id;
            const isNavStart = localStartId === node.id;
            const isNavEnd = localEndId === node.id;
            const isPartOfRoute = route.includes(node.id);

            // Xác định xem node hiện tại có phải là vị trí ảo của người dùng hay không
            const isUserCurrentVirtualLoc = navigationActive && navigationCurrentNodeId === node.id;

            // Xác định xem đây có phải là điểm cầu thang chuyển tiếp hiện tại của hành trình
            const isTransitionStart = crossFloorRouting && node.id === crossFloorRouting.transitionStartId;

            if (!isAdmin && node.type === 'waypoint') return;

            let showThisNode = false;
            let showLabel = false;

            if (isAdmin) {
                showThisNode = true;
                showLabel = true;
            } else if (isRouteActive) {
                if (isNavStart || isNavEnd || isUserCurrentVirtualLoc || isTransitionStart) {
                    showThisNode = true;
                    showLabel = true;
                } else if (isPartOfRoute && (node.type === 'stairs' || node.type === 'elevator' || node.type === 'transition' || node.customIcon)) {
                    showThisNode = true;
                    showLabel = true;
                }
            } else {
                if (node.type === 'classroom' || node.type === 'office') {
                    if (scale >= 1.4) {
                        showThisNode = true;
                        showLabel = true;
                    }
                } else if (node.type === 'service' || node.type === 'emergency' || node.customIcon) {
                    showThisNode = true;
                    showLabel = scale >= 1.1;
                } else {
                    if (node.label && (node.label.includes("KHU") || node.label.includes("CỔNG") || node.label.includes("SÂN") || node.label.includes("CANTIN"))) {
                        showThisNode = true;
                        showLabel = true;
                    }
                }
            }

            if (!showThisNode) return;

            const div = document.createElement('div');
            let stateClass = isSelected ? 'ring-4 ring-indigo-500' : '';
            if (isUserCurrentVirtualLoc || isNavStart || isTransitionStart) stateClass += ' current-loc-pulse';

            div.className = `node-ui absolute flex flex-col items-center z-20 ${stateClass}`;
            div.style.left = `${node.x}px`; div.style.top = `${node.y}px`;
            div.style.transform = `translate(-50%, -50%) rotate(${-view.rotation}deg)`; 

            let color = 'bg-slate-400';
            if (node.type === 'classroom') color = 'cat-classroom';
            else if (node.type === 'office') color = 'cat-office';
            else if (node.type === 'service') color = 'cat-service';
            else if (node.type === 'emergency') color = 'cat-emergency';
            else if (node.type === 'transition') color = 'bg-indigo-600';

            if (isUserCurrentVirtualLoc || isNavStart) color = 'bg-emerald-500 ring-4 ring-emerald-100';
            if (isNavEnd) color = 'bg-orange-500 ring-4 ring-orange-100 animate-bounce';
            if (isTransitionStart) color = 'bg-indigo-600 ring-4 ring-indigo-200 animate-pulse'; // Phát sáng sóng chuyển tiếp

            // Tăng nhẹ kích thước các mút bấm tương tác trên Mobile cho dễ chạm ngón tay (tối đa size 28px)
            let size = (isUserCurrentVirtualLoc || isNavStart) || isNavEnd || isTransitionStart ? 28 : (isPartOfRoute && (node.type === 'stairs' || node.type === 'elevator' || node.type === 'transition') ? 24 : (scale >= 1.6 ? 16 : 12));
            
            let displayIcon = node.customIcon || (node.type === 'transition' ? "🪜" : "📍");
            if (isUserCurrentVirtualLoc || isNavStart) displayIcon = "🚶";
            if (isNavEnd) displayIcon = "🎯";
            if (isTransitionStart) displayIcon = "🪜"; // Cầu thang nhấp nháy chuyển tiếp

            const useMiniDot = !(isUserCurrentVirtualLoc || isNavStart) && !isNavEnd && !isPartOfRoute && scale < 1.3;

            div.innerHTML = useMiniDot ? `
                <div class="rounded-full border border-white ${color} shadow-md hover:scale-125 transition-transform" style="width: 10px; height: 10px;"></div>
                ${showLabel && node.label ? `<div class="map-label mt-1">${node.label.toUpperCase()}</div>` : ''}
            ` : `
                <div class="rounded-full border-2 border-white ${color} flex items-center justify-center shadow-lg text-white font-bold hover:scale-110 transition-transform" style="width: ${size}px; height: ${size}px; font-size: ${size * 0.55}px;">
                    ${displayIcon}
                </div>
                ${showLabel && node.label ? `
                    <div class="map-label mt-1 text-center">
                        ${isUserCurrentVirtualLoc || isNavStart ? '<span class="text-[7px] text-emerald-500 block uppercase tracking-tighter font-extrabold">BẠN Ở ĐÂY</span>' : ''}
                        ${isTransitionStart ? '<span class="text-[7px] text-indigo-600 block uppercase tracking-tighter font-extrabold animate-bounce">BẤM LÊN TẦNG</span>' : ''}
                        ${node.label.toUpperCase()}
                    </div>
                ` : ''}
            `;

            let sX, sY, hM = false, startNodeX, startNodeY;
            const onS = (cX, cY) => {
                if (!isAdmin) return;
                sX = cX; sY = cY; hM = false;
                startNodeX = nodes[node.id].x; startNodeY = nodes[node.id].y;

                const onM = (me) => {
                    const curX = me.touches ? me.touches[0].clientX : me.clientX;
                    const curY = me.touches ? me.touches[0].clientY : me.clientY;
                    if (Math.abs(curX - sX) > 2 || Math.abs(curY - sY) > 2) {
                        if (mode === 'select') {
                            hM = true; div.classList.add('dragging');
                            let dx = (curX - sX) / view.scale, dy = (curY - sY) / view.scale;
                            const rad = -view.rotation * (Math.PI / 180);
                            nodes[node.id].x = startNodeX + (dx * Math.cos(rad) - dy * Math.sin(rad));
                            nodes[node.id].y = startNodeY + (dx * Math.sin(rad) + dy * Math.cos(rad));
                            div.style.left = `${nodes[node.id].x}px`; div.style.top = `${nodes[node.id].y}px`;
                            renderEdges();
                        }
                    }
                };
                const onE = () => {
                    window.removeEventListener('mousemove', onM); window.removeEventListener('mouseup', onE);
                    window.removeEventListener('touchmove', onM); window.removeEventListener('touchend', onE);
                    if (hM) { div.classList.remove('dragging'); saveData(true); } else handleNodeClick(node.id);
                };
                window.addEventListener('mousemove', onM); window.addEventListener('mouseup', onE);
                window.addEventListener('touchmove', onM, {passive:false}); window.addEventListener('touchend', onE);
            };

            div.onmousedown = (e) => { e.stopPropagation(); onS(e.clientX, e.clientY); };
            div.ontouchstart = (e) => { e.stopPropagation(); onS(e.touches[0].clientX, e.touches[0].clientY); };
            div.onclick = (e) => { e.stopPropagation(); handleNodeClick(node.id); };
            nodesLayer.appendChild(div);
        });
    }

    // TỐI ƯU HÓA: Vẽ đường nét đứt dẫn hướng đi bộ liên tục trên cùng mặt bằng ngang
    function renderEdges() {
        svgLayer.innerHTML = '';
        const currentFloorObj = floors.find(x => x.id === currentFloorId);
        const currentMapImage = currentFloorObj ? currentFloorObj.image : '';
        
        if (isAdmin) {
            edges.forEach(edge => {
                const n1 = nodes[edge[0]], n2 = nodes[edge[1]];
                if (n1 && n2 && getFloorImage(n1.floor) === currentMapImage && getFloorImage(n2.floor) === currentMapImage) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", n1.x); line.setAttribute("y1", n1.y);
                    line.setAttribute("x2", n2.x); line.setAttribute("y2", n2.y);
                    line.setAttribute("stroke", "#cbd5e1"); 
                    line.setAttribute("stroke-width", "1.5");
                    line.setAttribute("stroke-dasharray", "3");
                    svgLayer.appendChild(line);
                }
            });
        }
        
        for (let i = 0; i < route.length - 1; i++) {
            const n1 = nodes[route[i]], n2 = nodes[route[i+1]];
            if (n1 && n2 && getFloorImage(n1.floor) === currentMapImage && getFloorImage(n2.floor) === currentMapImage) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", n1.x); line.setAttribute("y1", n1.y);
                line.setAttribute("x2", n2.x); line.setAttribute("y2", n2.y);
                line.setAttribute("stroke", "#f97316"); line.setAttribute("stroke-width", "4");
                line.setAttribute("stroke-linecap", "round"); line.setAttribute("class", "route-line");
                svgLayer.appendChild(line);
            }
        }
    }

    function handleNodeClick(id) {
        const node = nodes[id]; if(!node) return;
        if (isAdmin) {
            if (mode === 'select') { selectedId = id; propsPanel.classList.remove('hidden'); updatePropsUI(); } 
            else if (mode === 'connect') {
                if (selectedId && selectedId !== id) { toggleEdge(selectedId, id); selectedId = id; } else selectedId = id;
            }
            renderNodes();
        } else {
            // Chuyển tầng mượt mà khi nhấp trực tiếp vào cầu thang dẫn đường trên bản đồ
            if (crossFloorRouting && (id === crossFloorRouting.transitionStartId || id === crossFloorRouting.transitionEndId)) {
                const targetFloorId = crossFloorRouting.endFloor;
                window.changeFloor(targetFloorId);
                
                // Cập nhật vị trí ảo lên tầng tiếp theo
                navigationCurrentNodeId = crossFloorRouting.transitionEndId;
                showMsg(`Đã lên ${floors.find(f => f.id === targetFloorId).name.toUpperCase()} - Tiếp tục di chuyển!`);
                updateRouteAndUI();
                return;
            }

            if (node.type !== 'waypoint') {
                if (!localStartId) {
                    localStartId = id;
                    localStorage.setItem('ind_local_start_id', id);
                    navigationActive = false;
                    buildQrLocationSelector();
                    showMsg("Đã đặt điểm xuất phát: " + node.label);
                    focusSingleNode(node);
                    
                    setTimeout(() => {
                        sidebarEndInput.placeholder = `📍 Điểm đến tiếp theo từ [${node.label}]?`;
                        sidebarEndInput.focus();
                        showLocationSuggestions("", sidebarEndSuggestions, 'end');
                    }, 450);
                } else if (localStartId === id) {
                    showMsg("Bạn đang ở vị trí này rồi!", false);
                } else {
                    localEndId = id;
                    navigationActive = false;
                    showMsg("Đang vẽ tuyến đường đến: " + node.label);
                    buildQrLocationSelector();
                    updateRouteAndUI();
                }
                renderNodes();
            }
        }
    }

    function toggleEdge(id1, id2) {
        const idx = edges.findIndex(e => (e[0]===id1 && e[1]===id2) || (e[0]===id2 && e[1]===id1));
        if(idx !== -1) edges.splice(idx, 1); else edges.push([id1, id2]);
        renderEdges();
    }

    function showRouteSummaryUI(destId) {
        const destNode = nodes[destId];
        if(!destNode) return;

        routeSummaryCard.classList.remove('hidden');
        quickActionsBar.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        document.getElementById('route-summary-dest').innerText = destNode.label.toUpperCase();
        
        // Tính tổng số bước ước tính toàn bộ chặng di chuyển đa tầng
        let totalNodesCount = route.length;
        if (navigationActive && floorSequence.length > 1) {
            // Đếm sơ bộ số lượng nút của toàn lộ trình liên tầng tuần tự
            totalNodesCount = floorSequence.length * 8; 
        }
        const steps = Math.round(totalNodesCount * 12);
        
        // Hiển thị thông tin chặng di chuyển hiện tại cho sinh động
        let stepProgressText = "";
        let sidebarStatusText = "";
        if (navigationActive && floorSequence.length > 1) {
            const currentNavNode = nodes[navigationCurrentNodeId];
            const currentFloorIdx = floorSequence.indexOf(currentNavNode?.floor);
            if (currentFloorIdx !== -1) {
                const totalStages = floorSequence.length;
                const currentStage = currentFloorIdx + 1;
                if (currentStage < totalStages) {
                    const transName = nodes[crossFloorRouting?.transitionStartId]?.label || "CẦU THANG";
                    stepProgressText = `Chặng ${currentStage}/${totalStages}: `;
                    sidebarStatusText = `Chặng ${currentStage}/${totalStages}: Đến cầu thang ${transName}`;
                } else {
                    stepProgressText = `Chặng ${currentStage}/${totalStages}: `;
                    sidebarStatusText = `Chặng ${currentStage}/${totalStages}: Tiếp tục đến đích`;
                }
            }
        }
        document.getElementById('route-summary-steps').innerText = `${stepProgressText}~${steps} bước`;

        // Cập nhật trạng thái chỉ đường lên Sidebar
        if (sidebarStatusText) {
            sidebarRouteStatus.classList.remove('hidden');
            sidebarRouteStatus.innerText = sidebarStatusText.toUpperCase();
        } else {
            sidebarRouteStatus.classList.add('hidden');
        }

        const fastSwitchBtn = document.getElementById('btn-route-switch-floor-fast');
        if (crossFloorRouting) {
            fastSwitchBtn.classList.remove('hidden');
            const targetFloor = floors.find(f => f.id === crossFloorRouting.endFloor);
            fastSwitchBtn.innerText = `BẤM LÊN ${targetFloor.name.toUpperCase()} (${targetFloor.area.toUpperCase()})`;
            fastSwitchBtn.onclick = () => {
                window.changeFloor(crossFloorRouting.endFloor);
                
                // Cập nhật vị trí ảo lên tầng tiếp theo
                navigationCurrentNodeId = crossFloorRouting.transitionEndId;
                showMsg(`Đã di chuyển lên ${targetFloor.name.toUpperCase()}`);
                updateRouteAndUI();
            };
        } else {
            fastSwitchBtn.classList.add('hidden');
        }
    }

    function hideRouteSummaryUI() {
        routeSummaryCard.classList.add('hidden');
        quickActionsBar.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
    }

    function checkNextFloorPrompt() {
        const p = document.getElementById('next-floor-prompt');
        if (crossFloorRouting) {
            p.classList.remove('hidden');
            const targetFloor = floors.find(f => f.id === crossFloorRouting.endFloor);
            const stairsName = nodes[crossFloorRouting.transitionStartId]?.label || "CẦU THANG";
            
            // Tính số bước còn lại cho chặng tiếp theo
            let remainingSteps = 68;
            const nextStagePath = findShortestPath(crossFloorRouting.transitionEndId, localEndId);
            if (nextStagePath) {
                remainingSteps = Math.round(nextStagePath.length * 12);
            }

            document.getElementById('prompt-text').innerHTML = `
                <span class="block font-black text-slate-800 text-[10px]">📍 Bạn đã đến cầu thang: ${stairsName}</span>
                <span class="block text-[9px] text-indigo-600 font-bold">⬆️ Tiếp tục lên ${targetFloor.name.toUpperCase()} (Đích đến còn cách ~${remainingSteps} bước)</span>
            `;

            document.getElementById('btn-switch-floor').onclick = () => {
